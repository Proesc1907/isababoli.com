<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İsababoli</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b12;
    --surface: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --shadow: 0 8px 40px rgba(0,0,0,0.5);
  }

  /* ── Light mode variables ── */
  body.light {
    --bg: #e8e2ff;
    --surface: rgba(255,255,255,0.92);
    --border: rgba(100,50,200,0.35);
    --shadow: 0 8px 40px rgba(70,30,180,0.18);
  }
  body.light .blob { opacity: 0.12; }

  /* Light: kartlar net görünsün */
  body.light .card {
    background: rgba(255,255,255,0.95);
    border-color: rgba(100,50,200,0.4);
    box-shadow: 0 6px 32px rgba(80,40,180,0.18);
  }
  body.light .card:hover {
    box-shadow: 0 18px 52px rgba(80,40,180,0.28);
  }

  /* Light: kart hover ışıkları */
  body.light .card-instagram:hover { box-shadow: 0 20px 60px rgba(245,133,41,0.5), 0 0 0 2px rgba(221,42,123,0.8); }
  body.light .card-discord:hover   { box-shadow: 0 20px 60px rgba(88,101,242,0.5), 0 0 0 2px rgba(88,101,242,0.8); }
  body.light .card-tiktok:hover    { box-shadow: 0 20px 60px rgba(0,242,234,0.45), 0 0 0 2px rgba(0,242,234,0.75); }
  body.light .card-spotify:hover   { box-shadow: 0 20px 60px rgba(30,215,96,0.5),  0 0 0 2px rgba(29,185,84,0.8); }
  body.light .card-facebook:hover  { box-shadow: 0 20px 60px rgba(24,119,242,0.5), 0 0 0 2px rgba(24,119,242,0.85); }

  /* Light mode hover glow (switcher) */

  /* Light: kart isim renkleri koyu ton */
  body.light .card-instagram .card-name { background: linear-gradient(90deg, #c9420a, #a01060, #c9420a, #a01060); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  body.light .card-discord   .card-name { background: linear-gradient(90deg, #3b4bbf, #5a6a8a, #3b4bbf, #5a6a8a); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  body.light .card-tiktok    .card-name { background: linear-gradient(90deg, #cc0040, #007a75, #cc0040, #007a75); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  body.light .card-spotify   .card-name { background: linear-gradient(90deg, #0d7a36, #8aa000, #0d7a36, #8aa000); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  body.light .card-facebook  .card-name { background: linear-gradient(90deg, #0a4fc4, #1877f2, #0a4fc4, #1877f2); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  /* Light: site title */
  body.light h1.site-title {
    background: linear-gradient(90deg, #6b25e0, #0a8080);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Light: particles daha belirgin */
  body.light #particles-js canvas { filter: invert(0) !important; }

  /* ── Liquid Glass Theme Switcher ── */
  /* ── Liquid Glass Switcher ── */
  #theme-switcher {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 500;
    opacity: 0;
    animation: entranceFromTopRight 0.75s cubic-bezier(.16,1,.3,1) 0.3s forwards;
  }

  /* Pill: yassı, geniş, tam yuvarlak uçlar */
  .glass-pill {
    display: flex;
    align-items: center;
    position: relative;
    padding: 4px;
    border-radius: 100px;
    background: #1c1b22;
    border: 1px solid rgba(255,255,255,0.07);
    box-shadow: 0 4px 20px rgba(0,0,0,0.65),
                inset 0 1px 0 rgba(255,255,255,0.05),
                inset 0 -1px 0 rgba(0,0,0,0.5);
    gap: 0;
  }
  body.light .glass-pill {
    background: rgba(218,214,228,0.97);
    border-color: rgba(155,140,185,0.22);
    box-shadow: 4px 4px 12px rgba(145,125,175,0.3),
               -3px -3px 8px rgba(255,255,255,0.92),
                inset 0 1px 0 rgba(255,255,255,0.92);
  }

  .glass-pill input[type="radio"] { display: none; }

  /* Slot — genişçe, kare değil dikdörtgen */
  .glass-pill label {
    position: relative;
    z-index: 2;
    width: 50px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 100px;
    user-select: none;
    transition: opacity 0.25s ease;
    opacity: 0.28;
  }
  .glass-pill label:hover { opacity: 0.58; }
  .glass-pill input:checked + label { opacity: 1; }

  /* ── İkonlar: outline/stroke ── */
  .glass-pill label svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: rgba(255,255,255,0.92);
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.35s cubic-bezier(.16,1,.3,1),
                stroke 0.3s ease,
                filter 0.3s ease;
  }
  body.light .glass-pill label svg {
    stroke: rgba(38,22,78,0.70);
  }
  .glass-pill label:hover svg { transform: scale(1.1); }
  .glass-pill input:checked + label svg { transform: scale(1.05); }

  /* Seçili sun → teal */
  .glass-pill:has(#opt-light:checked) #opt-light + label svg {
    stroke: #00d4c8;
    filter: drop-shadow(0 0 5px rgba(0,210,200,0.72));
  }
  /* Hover: sun → teal ipucu */
  .glass-pill label[for="opt-light"]:hover svg { stroke: #00d4c8; }

  /* ── Glider: yuvarlak dikdörtgen, slottan biraz küçük ── */
  .glass-glider {
    position: absolute;
    top: 4px;
    left: 4px;
    width: 50px;
    height: 42px;
    border-radius: 100px;
    background: rgba(62, 59, 74, 0.97);
    border: 1px solid rgba(255,255,255,0.09);
    box-shadow: 0 2px 8px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.11);
    transition: transform 0.42s cubic-bezier(.16,1,.3,1);
    z-index: 1;
    pointer-events: none;
  }
  body.light .glass-glider {
    background: rgba(255,255,255,0.97);
    border-color: rgba(175,155,210,0.28);
    box-shadow: 0 2px 8px rgba(120,90,170,0.16),
                inset 0 1px 0 rgba(255,255,255,1);
  }

  /* Glider konumları */
  .glass-pill:has(#opt-light:checked)  .glass-glider { transform: translateX(0px); }
  .glass-pill:has(#opt-dark:checked)   .glass-glider { transform: translateX(50px); }
  .glass-pill:has(#opt-system:checked) .glass-glider { transform: translateX(100px); }



  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    min-height: 100vh;
    font-family: 'Playfair Display', serif;
    overflow-x: hidden;
    transition: background 0.4s, color 0.4s;
  }

  /* Ambient background blobs */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.18;
    pointer-events: none;
    z-index: 0;
    transition: background 0.5s;
    transform: translateZ(0);
    will-change: transform;
  }
  .blob1 { width: 500px; height: 500px; background: #7b3ff2; top: -100px; left: -100px; }
  .blob2 { width: 400px; height: 400px; background: #00c8c8; bottom: -80px; right: -80px; }




  /* ── Giriş Animasyonları ── */
  @keyframes entranceFromLeft {
    from { opacity: 0; transform: translateX(-110vw) scale(0.75) rotate(-6deg); }
    to   { opacity: 1; transform: translateX(0) scale(1) rotate(0deg); }
  }
  @keyframes entranceFromRight {
    from { opacity: 0; transform: translateX(110vw) scale(0.75) rotate(6deg); }
    to   { opacity: 1; transform: translateX(0) scale(1) rotate(0deg); }
  }
  @keyframes entranceFromTop {
    from { opacity: 0; transform: translateY(-110vh) scale(0.75) rotate(4deg); }
    to   { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
  }
  @keyframes entranceFromBottom {
    from { opacity: 0; transform: translateY(110vh) scale(0.75) rotate(-4deg); }
    to   { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
  }
  @keyframes entranceFromTopRight {
    from { opacity: 0; transform: translate(80px, -80px) scale(0.5) rotate(20deg); }
    to   { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
  }
  @keyframes titleEntrance {
    from { opacity: 0; transform: translateY(-30px) scale(0.88); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── Kart Giriş Stilleri ── */
  #card-instagram {
    opacity: 0;
    animation: entranceFromBottom 1s cubic-bezier(.16,1,.3,1) 0.3s forwards;
  }
  #card-discord {
    opacity: 0;
    animation: entranceFromTop 1s cubic-bezier(.16,1,.3,1) 0.55s forwards;
  }
  #card-tiktok {
    opacity: 0;
    animation: entranceFromBottom 1s cubic-bezier(.16,1,.3,1) 0.8s forwards;
  }
  #card-spotify {
    opacity: 0;
    animation: entranceFromTop 1s cubic-bezier(.16,1,.3,1) 1.05s forwards;
  }
  #card-facebook {
    opacity: 0;
    animation: entranceFromBottom 1s cubic-bezier(.16,1,.3,1) 1.3s forwards;
  }

  /* ── Site Başlığı Girişi ── */
  h1.site-title {
    opacity: 0;
    animation: titleEntrance 0.9s cubic-bezier(.16,1,.3,1) 0.15s forwards;
  }

  /* ── Bildirim (Hoş Geldiniz) ── */
  #welcome-notif {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 600;
    display: flex;
    align-items: stretch;
    gap: 0;
    background: rgba(12, 8, 26, 0.78);
    backdrop-filter: blur(32px);
    -webkit-backdrop-filter: blur(32px);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px;
    padding: 0;
    min-width: 210px;
    overflow: hidden;
    opacity: 0;
    transform: translateY(-90px) scale(0.86);
    pointer-events: none;
    box-shadow: 0 16px 56px rgba(0,0,0,0.55), 0 0 0 1px rgba(176,127,255,0.06);
    animation: notifSlideIn 0.8s cubic-bezier(.16,1,.3,1) 2.2s forwards,
               notifFadeOut 0.6s cubic-bezier(.7,0,.3,1) 5.0s forwards;
  }
  body.light #welcome-notif {
    background: rgba(248,246,255,0.94);
    border-color: rgba(130,80,220,0.14);
    box-shadow: 0 16px 56px rgba(70,30,180,0.14), 0 0 0 1px rgba(130,80,220,0.07);
  }
  @keyframes notifSlideIn {
    0%   { opacity: 0; transform: translateY(-90px) scale(0.86); }
    50%  { opacity: 1; transform: translateY(5px) scale(1.01); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes notifFadeOut {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to   { opacity: 0; transform: translateY(-80px) scale(0.84); }
  }
  /* Sol aksan çizgisi */
  .notif-accent {
    width: 3px;
    background: linear-gradient(180deg, #b07fff 0%, #7ec8c8 100%);
    flex-shrink: 0;
    border-radius: 0;
  }
  body.light .notif-accent {
    background: linear-gradient(180deg, #7b3ff2 0%, #0a7070 100%);
  }
  .notif-body {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 14px 18px;
  }
  .notif-app-name {
    font-family: 'Playfair Display', serif;
    font-size: 0.62rem;
    font-weight: 700;
    color: rgba(176,127,255,0.75);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  body.light .notif-app-name { color: rgba(100,40,200,0.65); }
  .notif-message {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 900;
    color: rgba(255,255,255,0.9);
    letter-spacing: 0.01em;
    line-height: 1.2;
  }
  body.light .notif-message { color: rgba(15,8,45,0.88); }

  /* Main content */
  #main {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 40px 20px;
  }

  h1.site-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.5rem, 4vw, 2.8rem);
    font-weight: 900;
    background: linear-gradient(90deg, #b07fff, #7ec8c8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }

  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 22px;
    justify-content: center;
    align-items: stretch;
  }

  /* CARD BASE */
  .card {
    width: 190px;
    border-radius: 22px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    backdrop-filter: blur(14px);
    padding: 32px 20px 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    position: relative;
    overflow: hidden;
    transition: transform 0.45s cubic-bezier(.16,1,.3,1),
                box-shadow 0.45s cubic-bezier(.16,1,.3,1),
                border-color 0.35s ease;
    cursor: default;
    will-change: transform;
    contain: layout style;
  }

  /* Shimmer sweep pseudo-element */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    border-radius: 22px;
    transition: opacity 0.5s ease;
  }
  /* Moving shine line */
  .card::after {
    content: '';
    position: absolute;
    top: 0; left: -75%;
    width: 50%; height: 100%;
    background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.07) 50%, transparent 100%);
    transform: skewX(-20deg);
    transition: none;
    pointer-events: none;
  }
  .card:hover::after {
    animation: cardShine 0.75s cubic-bezier(.16,1,.3,1) forwards;
  }
  @keyframes cardShine {
    0%   { left: -75%; opacity: 0; }
    15%  { opacity: 1; }
    100% { left: 130%; opacity: 0; }
  }

  .card:hover { transform: translateY(-10px) scale(1.03); }
  .card:hover::before { opacity: 1; }

  /* Logo hover float */
  .card:hover .logo-wrap {
    animation: logoFloat 0.6s cubic-bezier(.16,1,.3,1) forwards;
  }
  @keyframes logoFloat {
    0%   { transform: translateY(0) scale(1); }
    50%  { transform: translateY(-6px) scale(1.08); }
    100% { transform: translateY(-4px) scale(1.05); }
  }

  /* Card name color shift */
  .card-name { background-size: 300%; }
  .card-instagram .card-name { background: linear-gradient(90deg, #f58529, #dd2a7b, #f58529, #dd2a7b); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; background-position: 0%; }
  .card-discord   .card-name { background: linear-gradient(90deg, #7289da, #99aab5, #7289da, #99aab5); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; background-position: 0%; }
  .card-tiktok    .card-name { background: linear-gradient(90deg, #ff0050, #00f2ea, #ff0050, #00f2ea); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; background-position: 0%; }
  .card-spotify   .card-name { background: linear-gradient(90deg, #d4f540, #1DB954, #d4f540, #1DB954); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; background-position: 0%; }
  .card-facebook  .card-name { background: linear-gradient(90deg, #1877f2, #42b0ff, #1877f2, #42b0ff); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; background-position: 0%; }

  .card-instagram:hover .card-name,
  .card-discord:hover   .card-name,
  .card-tiktok:hover    .card-name,
  .card-spotify:hover   .card-name,
  .card-facebook:hover  .card-name { animation: nameSlide 1.2s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes nameSlide {
    0%   { background-position: 0%; letter-spacing: 0.04em; }
    60%  { background-position: 180%; letter-spacing: 0.08em; }
    100% { background-position: 200%; letter-spacing: 0.06em; }
  }

  /* Button */
  .go-btn { background-size: 200% 100%; }
  .card-instagram .go-btn { background: linear-gradient(135deg, #f58529, #dd2a7b, #f58529); background-size: 200%; }
  .card-discord   .go-btn { background: linear-gradient(135deg, #5865F2, #1a2060, #5865F2); background-size: 200%; }
  .card-tiktok    .go-btn { background: linear-gradient(135deg, #ff0050, #00f2ea, #ff0050); background-size: 200%; }
  .card-spotify   .go-btn { background: linear-gradient(135deg, #1DB954, #e8e000, #1DB954); background-size: 200%; }
  .card-facebook  .go-btn { background: linear-gradient(135deg, #1877f2, #42b0ff, #1877f2); background-size: 200%; }
  .go-btn:hover { animation: btnShimmer 0.8s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes btnShimmer {
    0%   { background-position: 0% 50%;   filter: brightness(1)   saturate(1); transform: scale(1.1); }
    50%  { background-position: 100% 50%; filter: brightness(1.35) saturate(1.2); }
    100% { background-position: 0% 50%;   filter: brightness(1.15) saturate(1.1); transform: scale(1.1); }
  }

  /* Card glow halos */
  .card-instagram { box-shadow: var(--shadow); }
  .card-instagram:hover { box-shadow: 0 28px 70px rgba(245,133,41,0.55), 0 0 0 2px rgba(221,42,123,0.8), 0 0 40px rgba(221,42,123,0.2); border-color: rgba(221,42,123,0.5); }
  .card-instagram::before { background: linear-gradient(135deg, rgba(245,133,41,0.15), rgba(221,42,123,0.15)); }

  .card-discord:hover { box-shadow: 0 28px 70px rgba(88,101,242,0.6), 0 0 0 2px rgba(88,101,242,0.8), 0 0 40px rgba(88,101,242,0.2); border-color: rgba(88,101,242,0.5); }
  .card-discord::before { background: linear-gradient(135deg, rgba(88,101,242,0.15), rgba(20,30,80,0.12)); }

  .card-tiktok:hover { box-shadow: 0 28px 70px rgba(0,242,234,0.5), 0 0 0 2px rgba(0,242,234,0.75), 0 0 40px rgba(255,0,80,0.15); border-color: rgba(0,242,234,0.5); }
  .card-tiktok::before { background: linear-gradient(135deg, rgba(254,44,85,0.14), rgba(0,242,234,0.14)); }

  .card-spotify:hover { box-shadow: 0 28px 70px rgba(30,215,96,0.55), 0 0 0 2px rgba(212,245,64,0.7), 0 0 40px rgba(30,215,96,0.2); border-color: rgba(29,185,84,0.5); }
  .card-spotify::before { background: linear-gradient(135deg, rgba(30,215,96,0.15), rgba(212,245,64,0.13)); }

  .card-facebook:hover { box-shadow: 0 28px 70px rgba(24,119,242,0.6), 0 0 0 2px rgba(24,119,242,0.85), 0 0 40px rgba(66,176,255,0.2); border-color: rgba(24,119,242,0.5); }
  .card-facebook::before { background: linear-gradient(135deg, rgba(24,119,242,0.15), rgba(66,176,255,0.13)); }

  /* SVG logos */
  .logo-wrap {
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    position: relative;
    z-index: 1;
    transition: transform 0.55s cubic-bezier(.16,1,.3,1),
                box-shadow 0.55s cubic-bezier(.16,1,.3,1),
                width 0.7s cubic-bezier(.16,1,.3,1),
                height 0.7s cubic-bezier(.16,1,.3,1),
                border-radius 0.7s cubic-bezier(.16,1,.3,1);
  }
  .logo-wrap svg {
    width: 44px; height: 44px;
    transition: width 0.6s cubic-bezier(.16,1,.3,1),
                height 0.6s cubic-bezier(.16,1,.3,1);
  }

  .logo-instagram { background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af); }
  .logo-discord   { background: linear-gradient(135deg, #5865F2, #1a2060); }
  .logo-tiktok    { background: linear-gradient(135deg, #010101, #ff0050); }
  .logo-spotify   { background: linear-gradient(135deg, #1DB954, #e8e000); }
  .logo-facebook  { background: linear-gradient(135deg, #1877f2, #0a4fc4); }

  /* Logo hover ışık halkası */
  .card-instagram:hover .logo-wrap { box-shadow: 0 0 0 4px rgba(221,42,123,0.3), 0 8px 24px rgba(245,133,41,0.5); }
  .card-discord:hover   .logo-wrap { box-shadow: 0 0 0 4px rgba(88,101,242,0.35), 0 8px 24px rgba(88,101,242,0.5); }
  .card-tiktok:hover    .logo-wrap { box-shadow: 0 0 0 4px rgba(0,242,234,0.3), 0 8px 24px rgba(255,0,80,0.4); }
  .card-spotify:hover   .logo-wrap { box-shadow: 0 0 0 4px rgba(29,185,84,0.35), 0 8px 24px rgba(212,245,64,0.4); }
  .card-facebook:hover  .logo-wrap { box-shadow: 0 0 0 4px rgba(24,119,242,0.4), 0 8px 24px rgba(66,176,255,0.5); }

  .card-name {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.04em;
    position: relative;
    z-index: 1;
    transition: font-size 0.7s cubic-bezier(.16,1,.3,1),
                letter-spacing 0.7s cubic-bezier(.16,1,.3,1);
  }

  /* Go to Profile button */
  .go-btn {
    position: relative;
    z-index: 2;
    border: none;
    outline: none;
    border-radius: 50px;
    padding: 10px 20px;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(.16,1,.3,1),
                box-shadow 0.4s cubic-bezier(.16,1,.3,1),
                filter 0.3s ease;
    text-transform: uppercase;
    overflow: hidden;
  }
  /* Ripple on click */
  .go-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.3);
    opacity: 0;
    border-radius: 50px;
    transform: scale(0.5);
    transition: opacity 0.4s, transform 0.5s cubic-bezier(.16,1,.3,1);
  }
  .go-btn:active::after { opacity: 1; transform: scale(2); transition: none; }
  .go-btn:hover  { transform: scale(1.12) translateY(-2px); }
  .go-btn:active { transform: scale(0.95); }

  .card-instagram .go-btn { color: #fff; box-shadow: 0 4px 18px rgba(221,42,123,0.35); }
  .card-discord   .go-btn { color: #d0d8ff; box-shadow: 0 4px 18px rgba(88,101,242,0.35); }
  .card-tiktok    .go-btn { color: #fff; box-shadow: 0 4px 18px rgba(255,0,80,0.3); }
  .card-spotify   .go-btn { color: #1a1a00; box-shadow: 0 4px 18px rgba(30,215,96,0.35); }
  .card-facebook  .go-btn { color: #fff; box-shadow: 0 4px 18px rgba(24,119,242,0.4); }

  /* Hover'da buton glow */
  .card-instagram:hover .go-btn { box-shadow: 0 8px 28px rgba(221,42,123,0.55); }
  .card-discord:hover   .go-btn { box-shadow: 0 8px 28px rgba(88,101,242,0.55); }
  .card-tiktok:hover    .go-btn { box-shadow: 0 8px 28px rgba(255,0,80,0.5); }
  .card-spotify:hover   .go-btn { box-shadow: 0 8px 28px rgba(30,215,96,0.55); }
  .card-facebook:hover  .go-btn { box-shadow: 0 8px 28px rgba(24,119,242,0.6); }

  /* ── Kart Çıkış Animasyonları ── */
  .card-exit-left  { will-change: transform, opacity; animation: exitLeft  0.55s cubic-bezier(.55,0,.1,1) forwards !important; }
  .card-exit-right { will-change: transform, opacity; animation: exitRight 0.55s cubic-bezier(.55,0,.1,1) forwards !important; }
  .card-exit-down  { will-change: transform, opacity; animation: exitDown  0.55s cubic-bezier(.55,0,.1,1) forwards !important; }
  .card-exit-up    { will-change: transform, opacity; animation: exitUp    0.55s cubic-bezier(.55,0,.1,1) forwards !important; }

  @keyframes exitLeft {
    0%   { opacity:1; transform: translateX(0)     scale(1)    rotate(0deg); }
    30%  { opacity:1; transform: translateX(-20px) scale(0.95) rotate(-3deg); }
    100% { opacity:0; transform: translateX(-160%) scale(0.75) rotate(-12deg); }
  }
  @keyframes exitRight {
    0%   { opacity:1; transform: translateX(0)    scale(1)    rotate(0deg); }
    30%  { opacity:1; transform: translateX(20px) scale(0.95) rotate(3deg); }
    100% { opacity:0; transform: translateX(160%) scale(0.75) rotate(12deg); }
  }
  @keyframes exitDown {
    0%   { opacity:1; transform: translateY(0)    scale(1)    rotate(0deg); }
    30%  { opacity:1; transform: translateY(15px) scale(0.95) rotate(2deg); }
    100% { opacity:0; transform: translateY(140%) scale(0.75) rotate(5deg); }
  }
  @keyframes exitUp {
    0%   { opacity:1; transform: translateY(0)     scale(1)    rotate(0deg); }
    30%  { opacity:1; transform: translateY(-12px) scale(0.96) rotate(-1deg); }
    100% { opacity:0; transform: translateY(-110%) scale(0.8)  rotate(-4deg); }
  }

  /* ── Kart Genişleme Animasyonu ── */
  /* Expand sırasında iç elementler büyür */
  .card.expanding .logo-wrap {
    transition: width 0.9s cubic-bezier(.16,1,.3,1) 0.2s,
                height 0.9s cubic-bezier(.16,1,.3,1) 0.2s,
                border-radius 0.7s cubic-bezier(.16,1,.3,1) 0.2s !important;
    width: 130px !important; height: 130px !important; border-radius: 32px !important;
    will-change: width, height;
  }
  .card.expanding .logo-wrap svg {
    transition: width 0.8s cubic-bezier(.16,1,.3,1) 0.25s,
                height 0.8s cubic-bezier(.16,1,.3,1) 0.25s !important;
    width: 86px !important; height: 86px !important;
  }
  .card.expanding .card-name {
    transition: font-size 0.8s cubic-bezier(.16,1,.3,1) 0.3s,
                letter-spacing 0.8s cubic-bezier(.16,1,.3,1) 0.3s !important;
    font-size: 2.6rem !important;
    letter-spacing: 0.1em !important;
  }
  /* Genişleyen kartın içinde ışık halkası */
  .card.expanding::before {
    animation: expandPulse 1.2s ease-in-out infinite !important;
    opacity: 1 !important;
  }
  @keyframes expandPulse {
    0%,100% { opacity: 0.5; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.05); }
  }

  /* ── Buton Morph ── */
  .go-btn.going {
    animation: btnMorph 0.5s cubic-bezier(.16,1,.3,1) forwards;
    pointer-events: none;
    white-space: nowrap;
  }
  @keyframes btnMorph {
    0%   { transform: scale(1);    opacity: 1; letter-spacing: 0.05em; }
    25%  { transform: scale(0.88); opacity: 0.4; letter-spacing: 0em; }
    60%  { transform: scale(1.06); opacity: 0.9; letter-spacing: 0.07em; }
    100% { transform: scale(1.03); opacity: 1;   letter-spacing: 0.06em; }
  }
  .going-dots span {
    display: inline-block;
    animation: dotBounce 1s cubic-bezier(.16,1,.3,1) infinite;
  }
  .going-dots span:nth-child(2) { animation-delay: 0.15s; }
  .going-dots span:nth-child(3) { animation-delay: 0.30s; }
  @keyframes dotBounce {
    0%,100% { opacity:0.25; transform: translateY(0) scale(0.8); }
    45%     { opacity:1;    transform: translateY(-5px) scale(1.2); }
    65%     { transform: translateY(1px) scale(0.95); }
  }

  /* Particles.js */
  #particles-js {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    width: 100%;
    height: 100%;
  }

  /* ══════════════════════════════════════════════════
     MOBİL VERSİYON — sadece touch cihazlara uygulanır
     ══════════════════════════════════════════════════ */
  @media (max-width: 768px), (hover: none) and (pointer: coarse) {

    /* ── Tema butonu ── */
    #theme-toggle {
      top: 14px;
      right: 14px;
      width: 46px;
      height: 46px;
    }

    /* ── Ana içerik padding ── */
    #main {
      padding: 80px 16px 40px;
      gap: 18px;
    }

    /* ── Site başlığı ── */
    h1.site-title {
      font-size: clamp(1.6rem, 7vw, 2.4rem);
      margin-bottom: 6px;
      text-align: center;
    }

    /* ── Kartlar: 2 sütunlu grid ── */
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
      max-width: 500px;
    }

    /* ── Kart boyutu ve dokunma alanı ── */
    .card {
      width: 100%;
      min-height: 170px;
      border-radius: 20px;
      padding: 24px 14px 20px;
      gap: 14px;
      /* Hover yerine basılınca efekt */
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.2s cubic-bezier(.16,1,.3,1),
                  box-shadow 0.2s cubic-bezier(.16,1,.3,1);
    }

    /* ── Dokunma sırasında hafif baskı efekti ── */
    .card:active {
      transform: scale(0.96) !important;
    }

    /* ── Logo ── */
    .logo-wrap {
      width: 52px;
      height: 52px;
      border-radius: 14px;
    }
    .logo-wrap svg {
      width: 34px;
      height: 34px;
    }

    /* ── Kart ismi ── */
    .card-name {
      font-size: 0.95rem;
    }

    /* ── Buton — parmakla kolay tıklanabilir ── */
    .go-btn {
      padding: 11px 16px;
      font-size: 0.75rem;
      width: 100%;
      border-radius: 50px;
      touch-action: manipulation;
    }
    .go-btn:active {
      transform: scale(0.95) !important;
    }

    /* ── Blob'lar mobilde küçülsün ── */
    .blob1 { width: 280px; height: 280px; }
    .blob2 { width: 220px; height: 220px; }

    /* ── Kart hover glowları mobilde kapalı ── */
    .card-instagram:hover,
    .card-discord:hover,
    .card-tiktok:hover,
    .card-spotify:hover {
      transform: none;
      box-shadow: var(--shadow);
    }
    .card-instagram:hover .logo-wrap,
    .card-discord:hover   .logo-wrap,
    .card-tiktok:hover    .logo-wrap,
    .card-spotify:hover   .logo-wrap {
      box-shadow: none;
    }

    /* ── Kart active glow (dokunmada) ── */
    .card-instagram:active { box-shadow: 0 10px 40px rgba(245,133,41,0.45), 0 0 0 2px rgba(221,42,123,0.7); }
    .card-discord:active   { box-shadow: 0 10px 40px rgba(88,101,242,0.5),  0 0 0 2px rgba(88,101,242,0.7); }
    .card-tiktok:active    { box-shadow: 0 10px 40px rgba(0,242,234,0.4),   0 0 0 2px rgba(0,242,234,0.65); }
    .card-spotify:active   { box-shadow: 0 10px 40px rgba(30,215,96,0.45),  0 0 0 2px rgba(29,185,84,0.7); }

    /* ── Theme toggle hover efekti mobilde yok ── */
    #theme-toggle:hover {
      transform: none;
      box-shadow: 0 4px 24px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.15);
    }
    #theme-toggle:active {
      transform: scale(0.92) rotate(10deg);
    }
  }

  /* ── Çok küçük ekranlar (SE, eski Android) ── */
  @media (max-width: 360px) {
    .cards {
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .card {
      min-height: 155px;
      padding: 18px 10px 16px;
    }
    .logo-wrap { width: 44px; height: 44px; }
    .logo-wrap svg { width: 28px; height: 28px; }
    .go-btn { font-size: 0.68rem; padding: 9px 10px; }
  }

  /* ── Animasyon süresince kart hover efektleri kapalı ── */
  body.cards-locked .card {
    pointer-events: none;
  }
  body.cards-locked .card:hover {
    transform: none !important;
    box-shadow: var(--shadow) !important;
    border-color: var(--border) !important;
  }
  body.cards-locked .card:hover::before { opacity: 0 !important; }
  body.cards-locked .card:hover::after  { animation: none !important; }
  body.cards-locked .card:hover .logo-wrap { animation: none !important; box-shadow: none !important; }
  body.cards-locked .card:hover .card-name { animation: none !important; }
  body.cards-locked .card:hover .go-btn    { transform: none !important; }

  /* ── Buton Kilit Stili (glow bitmeden tıklanamaz) ── */
  .go-btn.btn-locked {
    pointer-events: none;
    opacity: 0.38;
    cursor: not-allowed;
    filter: grayscale(0.4);
  }

  /* ── Buton Açılış Zıplama Animasyonu ── */
  @keyframes btnUnlock {
    0%   { transform: scale(1);    opacity: 0.38; filter: grayscale(0.4); }
    45%  { transform: scale(1.13); opacity: 1;    filter: grayscale(0); }
    68%  { transform: scale(0.95); }
    85%  { transform: scale(1.05); }
    100% { transform: scale(1);    opacity: 1;    filter: grayscale(0); }
  }
  .go-btn.btn-unlocking {
    animation: btnUnlock 0.85s cubic-bezier(.34,1.4,.64,1) forwards;
    pointer-events: none;
  }

  /* ── Intro Glow Dalgası: Hover ile birebir aynı efekt ── */
  .card.intro-glow {
    transform: translateY(-10px) scale(1.03) !important;
  }
  .card.intro-glow::before { opacity: 1 !important; }

  .card-instagram.intro-glow {
    box-shadow: 0 28px 70px rgba(245,133,41,0.55), 0 0 0 2px rgba(221,42,123,0.8), 0 0 40px rgba(221,42,123,0.2) !important;
    border-color: rgba(221,42,123,0.5) !important;
  }
  .card-instagram.intro-glow .logo-wrap {
    box-shadow: 0 0 0 4px rgba(221,42,123,0.3), 0 8px 24px rgba(245,133,41,0.5) !important;
  }
  .card-discord.intro-glow {
    box-shadow: 0 28px 70px rgba(88,101,242,0.6), 0 0 0 2px rgba(88,101,242,0.8), 0 0 40px rgba(88,101,242,0.2) !important;
    border-color: rgba(88,101,242,0.5) !important;
  }
  .card-discord.intro-glow .logo-wrap {
    box-shadow: 0 0 0 4px rgba(88,101,242,0.35), 0 8px 24px rgba(88,101,242,0.5) !important;
  }
  .card-tiktok.intro-glow {
    box-shadow: 0 28px 70px rgba(0,242,234,0.5), 0 0 0 2px rgba(0,242,234,0.75), 0 0 40px rgba(255,0,80,0.15) !important;
    border-color: rgba(0,242,234,0.5) !important;
  }
  .card-tiktok.intro-glow .logo-wrap {
    box-shadow: 0 0 0 4px rgba(0,242,234,0.3), 0 8px 24px rgba(255,0,80,0.4) !important;
  }
  .card-spotify.intro-glow {
    box-shadow: 0 28px 70px rgba(30,215,96,0.55), 0 0 0 2px rgba(212,245,64,0.7), 0 0 40px rgba(30,215,96,0.2) !important;
    border-color: rgba(29,185,84,0.5) !important;
  }
  .card-spotify.intro-glow .logo-wrap {
    box-shadow: 0 0 0 4px rgba(29,185,84,0.35), 0 8px 24px rgba(212,245,64,0.4) !important;
  }
  .card-facebook.intro-glow {
    box-shadow: 0 28px 70px rgba(24,119,242,0.6), 0 0 0 2px rgba(24,119,242,0.85), 0 0 40px rgba(66,176,255,0.2) !important;
    border-color: rgba(24,119,242,0.5) !important;
  }
  .card-facebook.intro-glow .logo-wrap {
    box-shadow: 0 0 0 4px rgba(24,119,242,0.4), 0 8px 24px rgba(66,176,255,0.5) !important;
  }

  /* ── Soldan Sağa Işık Süpürmesi ── */
  #flash-overlay {
    position: fixed;
    inset: 0;
    z-index: 400;
    pointer-events: none;
    opacity: 0;
    overflow: hidden;
  }
  #flash-overlay::after {
    content: '';
    position: absolute;
    top: 0;
    left: -60%;
    width: 40%;
    height: 100%;
    background: linear-gradient(
      105deg,
      transparent 0%,
      rgba(255,255,255,0.08) 30%,
      rgba(255,255,255,0.28) 50%,
      rgba(255,255,255,0.08) 70%,
      transparent 100%
    );
    transform: skewX(-12deg);
  }
  #flash-overlay.flash {
    opacity: 1;
    animation: sweepLight 0.9s cubic-bezier(.25,1,.5,1) forwards;
  }
  @keyframes sweepLight {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }
  #flash-overlay.flash::after {
    animation: sweepMove 0.9s cubic-bezier(.25,1,.5,1) forwards;
  }
  @keyframes sweepMove {
    0%   { left: -60%; }
    100% { left: 130%; }
  }
</style>

<script>
  // ── Animasyon boyunca hover efektlerini kilitle ──
  document.body.classList.add('cards-locked');

  // ── Liquid Glass Theme Switcher ──────────────────────
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)');

  function applyTheme(mode) {
    if (mode === 'light') {
      document.body.classList.add('light');
    } else if (mode === 'dark') {
      document.body.classList.remove('light');
    } else {
      // system
      if (systemDark.matches) document.body.classList.remove('light');
      else document.body.classList.add('light');
    }
  }

  const savedTheme = localStorage.getItem('theme') || 'dark';
  applyTheme(savedTheme);

  // Set the correct radio on load
  const radioToCheck = document.getElementById('opt-' + savedTheme);
  if (radioToCheck) radioToCheck.checked = true;

  document.querySelectorAll('.glass-pill input[type="radio"]').forEach(radio => {
    radio.addEventListener('change', () => {
      const mode = radio.value;
      applyTheme(mode);
      localStorage.setItem('theme', mode);
      updateParticlesTheme();
    });
  });

  // System mode: update when OS preference changes
  systemDark.addEventListener('change', () => {
    if (localStorage.getItem('theme') === 'system') applyTheme('system');
  });

  // ── Soldan Sağa Glow Dalgası ──────────────────────────────
  // Son kart ~2.05s'de yerleşir, 2.2s'de dalga başlar
  const glowWaveOrder   = ['instagram', 'discord', 'tiktok', 'spotify', 'facebook'];
  const glowWaveStagger = 200; // ms kart arası gecikme
  const glowWaveHold    = 500; // ms parlak kalma süresi

  setTimeout(() => {
    glowWaveOrder.forEach((id, i) => {
      const card = document.getElementById('card-' + id);
      card.style.opacity   = '1';
      card.style.animation = 'none';

      setTimeout(() => {
        // Tam hover efektini CSS class ile uygula
        card.classList.add('intro-glow');

        setTimeout(() => {
          card.classList.remove('intro-glow');
        }, glowWaveHold);

      }, i * glowWaveStagger);
    });
  }, 2200);

  // ── Glow bittikten sonra butonları sırayla aç (soldan sağa) ──
  // Son kart glowu: 2200 + 3*200 + 500 = 3300ms → +150ms buffer = 3450ms
  const btnUnlockOrder   = ['instagram', 'discord', 'tiktok', 'spotify', 'facebook'];
  const btnUnlockStagger = 200; // ms buton arası gecikme

  btnUnlockOrder.forEach((id, i) => {
    setTimeout(() => {
      const btn = document.getElementById(id + '-btn');
      // Kilit class'ını kaldır, zıplama animasyonunu başlat
      btn.classList.remove('btn-locked');
      btn.classList.add('btn-unlocking');
      // Animasyon bitince unlocking class'ını temizle ve tıklamaya aç
    setTimeout(() => {
        btn.classList.remove('btn-unlocking');
        // Son butonsa hover kilidini de kaldır
        if (i === btnUnlockOrder.length - 1) {
          document.body.classList.remove('cards-locked');
        }
      }, 880);
    }, 3450 + i * btnUnlockStagger);
  });

  // ── Evrensel Kart Genişleme Animasyonu ──────────────────────
  const cardGlows = {
    instagram: '0 0 140px rgba(245,133,41,0.65), 0 0 0 4px rgba(221,42,123,0.9)',
    discord:   '0 0 140px rgba(88,101,242,0.65), 0 0 0 4px rgba(88,101,242,0.9)',
    tiktok:    '0 0 140px rgba(0,242,234,0.55),  0 0 0 4px rgba(255,0,80,0.9)',
    spotify:   '0 0 140px rgba(30,215,96,0.65),  0 0 0 4px rgba(212,245,64,0.8)',
    facebook:  '0 0 140px rgba(24,119,242,0.7),  0 0 0 4px rgba(66,176,255,0.9)',
  };

  function goToInstagram(url) { expandCard('instagram', url); }
  function goToDiscord(url)   { expandCard('discord',   url); }
  function goToTikTok(url)    { expandCard('tiktok',    url); }
  function goToSpotify(url)   { expandCard('spotify',   url); }
  function goToFacebook(url)  { expandCard('facebook',  url); }

  function expandCard(type, url) {
    const card    = document.querySelector('.card-' + type);
    const btn     = document.getElementById(type + '-btn');
    const title   = document.querySelector('.site-title');
    const allIds  = ['instagram', 'discord', 'tiktok', 'spotify', 'facebook'];
    const others  = allIds.filter(id => id !== type);

    // rect'i EN BAŞTA oku — animasyonlar başlamadan önce
    const rect = card.getBoundingClientRect();

    // Kartı hemen fixed konuma al (layout'tan çıkar, kayma olmaz)
    card.style.position       = 'fixed';
    card.style.left           = rect.left + 'px';
    card.style.top            = rect.top  + 'px';
    card.style.width          = rect.width + 'px';
    card.style.height         = rect.height + 'px';
    card.style.margin         = '0';
    card.style.zIndex         = '150';
    card.style.transition     = 'none';
    card.style.display        = 'flex';
    card.style.flexDirection  = 'column';
    card.style.alignItems     = 'center';
    card.style.justifyContent = 'center';
    card.style.willChange     = 'left, top, width, height';
    card.classList.add('expanding');

    const exitClasses = ['card-exit-left','card-exit-right','card-exit-down','card-exit-up'];

    // 1) Diğer kartlar sıralı (stagger) uçup gider
    others.forEach((id, i) => {
      const el = document.getElementById('card-' + id);
      if (!el) return;
      setTimeout(() => {
        el.classList.add(exitClasses[i % exitClasses.length]);
      }, i * 60);
    });
    title.classList.add('card-exit-up');

    // 2) Buton → "Profil'e Gidiliyor..."
    setTimeout(() => {
      btn.classList.add('going');
      btn.innerHTML = 'Profil\'e Gidiliyor <span class="going-dots"><span>.</span><span>.</span><span>.</span></span>';
    }, 80);

    // 3) Tam ekrana genişlet
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const ease = 'cubic-bezier(.16,1,.3,1)';
        card.style.transition = `left 1s ${ease}, top 1s ${ease}, width 1s ${ease}, height 1s ${ease}, border-radius 1s ${ease}`;
        card.style.left         = '0';
        card.style.top          = '0';
        card.style.width        = '100vw';
        card.style.height       = '100vh';
        card.style.borderRadius = '0';
        card.style.boxShadow    = cardGlows[type]; // transition dışında — anlık
      });
    });

    // 5) Parlama flaşı — kart tam ekrana gerilince
    setTimeout(() => {
      const flash = document.getElementById('flash-overlay');
      flash.classList.remove('flash');
      flash.offsetWidth; // reflow
      flash.classList.add('flash');
    }, 1380);

    // 6) Sayfayı aç & sıfırla
    setTimeout(() => {
      window.open(url, '_blank');
      setTimeout(() => {
        card.style.transition = 'opacity 0.6s cubic-bezier(.7,0,.3,1)';
        card.style.opacity    = '0';
        setTimeout(() => {
          card.removeAttribute('style');
          card.classList.remove('expanding');
          others.forEach(id => {
            const el = document.getElementById('card-' + id);
            if (el) el.className = el.className.replace(/card-exit-\w+/g, '').trim();
          });
          title.classList.remove('card-exit-up');
          btn.classList.remove('going');
          btn.innerHTML = 'Profil\'e Git';
        }, 620);
      }, 350);
    }, 2600);
  }

</script>
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script>
  // Particles config
  function getParticlesConfig(isLight) {
    return {
      particles: {
        number: { value: 55, density: { enable: true, value_area: 800 } },
        color: { value: isLight ? ['#6b25e0', '#0a7070', '#9b3ff0', '#1a4a8a'] : ['#b07fff', '#7ec8c8', '#c084fc', '#ffffff'] },
        shape: { type: 'circle' },
        opacity: {
          value: isLight ? 0.85 : 0.5,
          random: true,
          anim: { enable: true, speed: 1, opacity_min: isLight ? 0.4 : 0.1, sync: false }
        },
        size: {
          value: isLight ? 4 : 3,
          random: true,
          anim: { enable: true, speed: 2, size_min: 0.5, sync: false }
        },
        line_linked: {
          enable: true,
          distance: 130,
          color: isLight ? '#6b25e0' : '#b07fff',
          opacity: isLight ? 0.35 : 0.12,
          width: isLight ? 1.5 : 1
        },
        move: {
          enable: true,
          speed: 1.2,
          direction: 'none',
          random: true,
          straight: false,
          out_mode: 'out',
          bounce: false
        }
      },
      interactivity: {
        detect_on: 'canvas',
        events: {
          onhover: { enable: true, mode: 'grab' },
          onclick: { enable: true, mode: 'push' },
          resize: true
        },
        modes: {
          grab: { distance: 140, line_linked: { opacity: isLight ? 0.7 : 0.35 } },
          push: { particles_nb: 4 }
        }
      },
      retina_detect: true
    };
  }

  // Mobilde particles sayısını azalt
  const isMobile = window.matchMedia('(max-width: 768px)').matches
    || window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  if (isMobile) {
    const baseCfg = getParticlesConfig(document.body.classList.contains('light'));
    baseCfg.particles.number.value = 30;
    baseCfg.particles.line_linked.enable = false;
    particlesJS('particles-js', baseCfg);
  } else {
    particlesJS('particles-js', getParticlesConfig(document.body.classList.contains('light')));
  }

  // Tema değişince particles'ı yeniden başlat (mobil ayarlarına da dikkat et)
  function updateParticlesTheme() {
    const isLight = document.body.classList.contains('light');
    if (window.pJSDom && window.pJSDom.length > 0) {
      window.pJSDom[0].pJS.fn.vendors.destroypJS();
      window.pJSDom = [];
    }
    if (isMobile) {
      const mobileCfg = getParticlesConfig(isLight);
      mobileCfg.particles.number.value = 30;
      mobileCfg.particles.line_linked.enable = false;
      particlesJS('particles-js', mobileCfg);
    } else {
      particlesJS('particles-js', getParticlesConfig(isLight));
    }
  }
  // particles listener is now handled by the radio change events above
</script>
