<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sosyal Medyam</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b12;
    --bg2: #111120;
    --surface: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --text: #c8b8f0;
    --text2: #7ec8c8;
    --shadow: 0 8px 40px rgba(0,0,0,0.5);
  }

  /* ── Light mode variables ── */
  body.light {
    --bg: #e8e2ff;
    --bg2: #ddd5ff;
    --surface: rgba(255,255,255,0.92);
    --border: rgba(100,50,200,0.35);
    --text: #2d1a66;
    --text2: #0a6060;
    --shadow: 0 8px 40px rgba(70,30,180,0.18);
  }
  body.light .blob { opacity: 0.35; }

  /* Light: kartlar net görünsün */
  body.light .card {
    background: rgba(255,255,255,0.95);
    border-color: rgba(100,50,200,0.4);
    box-shadow: 0 6px 32px rgba(80,40,180,0.18);
  }
  body.light .card:hover {
    box-shadow: 0 18px 52px rgba(80,40,180,0.28);
  }

  /* Light: kart hover ışıkları */
  body.light .card-instagram:hover { box-shadow: 0 20px 60px rgba(245,133,41,0.5), 0 0 0 2px rgba(221,42,123,0.8); }
  body.light .card-discord:hover   { box-shadow: 0 20px 60px rgba(88,101,242,0.5), 0 0 0 2px rgba(88,101,242,0.8); }
  body.light .card-tiktok:hover    { box-shadow: 0 20px 60px rgba(0,242,234,0.45), 0 0 0 2px rgba(0,242,234,0.75); }
  body.light .card-spotify:hover   { box-shadow: 0 20px 60px rgba(30,215,96,0.5),  0 0 0 2px rgba(29,185,84,0.8); }

  /* Light: tema butonu hover ışığı */
  body.light #theme-toggle:hover { box-shadow: 0 20px 60px rgba(176,127,255,0.45), 0 0 0 2px rgba(176,127,255,0.9); border-color: rgba(176,127,255,0.8); }

  /* Light: kart isim renkleri koyu ton */
  body.light .card-instagram .card-name { background: linear-gradient(90deg, #c9420a, #a01060, #c9420a, #a01060); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  body.light .card-discord   .card-name { background: linear-gradient(90deg, #3b4bbf, #5a6a8a, #3b4bbf, #5a6a8a); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  body.light .card-tiktok    .card-name { background: linear-gradient(90deg, #cc0040, #007a75, #cc0040, #007a75); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  body.light .card-spotify   .card-name { background: linear-gradient(90deg, #0d7a36, #8aa000, #0d7a36, #8aa000); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  /* Light: about section */
  body.light .about-section {
    background: rgba(255,255,255,0.95);
    border-color: rgba(100,50,200,0.4);
    box-shadow: 0 6px 32px rgba(80,40,180,0.15);
  }
  body.light .about-name {
    background: linear-gradient(90deg, #5a20cc 0%, #0a7070 60%, #7030cc 100%);
    background-size: 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  body.light .about-footer span { color: var(--text); opacity: 0.7; }

  /* Light: tag renkleri */
  body.light .about-tag.tag-game {
    background: rgba(10,96,96,0.14);
    border-color: rgba(10,96,96,0.5);
    color: #085555;
    font-weight: 700;
  }
  body.light .about-tag.tag-pc {
    background: rgba(90,32,204,0.12);
    border-color: rgba(90,32,204,0.45);
    color: #4a1899;
    font-weight: 700;
  }
  body.light .about-tag.tag-age {
    background: rgba(45,26,102,0.09);
    border-color: rgba(45,26,102,0.3);
    color: var(--text);
    font-weight: 700;
  }

  /* Light: site title */
  body.light h1.site-title {
    background: linear-gradient(90deg, #6b25e0, #0a8080);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Light: about label */
  body.light .about-label {
    background: linear-gradient(90deg, #6b25e0, #0a8080);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Light: particles daha belirgin */
  body.light #particles-js canvas { filter: invert(0) !important; }

  /* Light: cursor ring */
  body.light #cursor-ring {
    border-color: rgba(90,30,190,0.65);
    background: rgba(90,30,190,0.08);
  }

  /* ── Theme Toggle Button ── */
  #theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 500;
    width: 52px;
    height: 52px;
    border-radius: 16px;
    border: 1.5px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 4px 24px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    transition: transform 0.3s cubic-bezier(.16,1,.3,1), box-shadow 0.3s, background 0.3s, border-color 0.3s;
    overflow: hidden;
  }
  body.light #theme-toggle {
    background: rgba(255,255,255,0.6);
    border-color: rgba(130,80,220,0.2);
    box-shadow: 0 4px 24px rgba(100,60,200,0.15), inset 0 1px 0 rgba(255,255,255,0.8);
  }
  #theme-toggle:hover { transform: scale(1.1) rotate(10deg); box-shadow: 0 20px 60px rgba(176,127,255,0.45), 0 0 0 2px rgba(176,127,255,0.9); border-color: rgba(176,127,255,0.8); }
  #theme-toggle::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 16px;
    opacity: 0;
    background: linear-gradient(135deg, rgba(176,127,255,0.18), rgba(126,200,200,0.1));
    transition: opacity 0.35s;
    pointer-events: none;
  }
  #theme-toggle:hover::after { opacity: 1; }
  #theme-toggle .icon-sun, #theme-toggle .icon-moon { position: absolute; transition: opacity 0.3s, transform 0.4s; }
  #theme-toggle .icon-sun  { opacity: 0; transform: rotate(-90deg) scale(0.6); }
  #theme-toggle .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }
  body.light #theme-toggle .icon-sun  { opacity: 1; transform: rotate(0deg) scale(1); }
  body.light #theme-toggle .icon-moon { opacity: 0; transform: rotate(90deg) scale(0.6); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    min-height: 100vh;
    font-family: 'Playfair Display', serif;
    overflow-x: hidden;
    transition: background 0.4s, color 0.4s;
  }

  /* Ambient background blobs */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.18;
    pointer-events: none;
    z-index: 0;
    transition: background 0.5s;
  }
  .blob1 { width: 500px; height: 500px; background: #7b3ff2; top: -100px; left: -100px; }
  .blob2 { width: 400px; height: 400px; background: #00c8c8; bottom: -80px; right: -80px; }
  body.light .blob { opacity: 0.12; }




  /* Welcome screen */
  #welcome-screen {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    pointer-events: none;
  }
  #welcome-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 10vw, 7rem);
    font-weight: 900;
    background: linear-gradient(135deg, #b07fff 0%, #7ec8c8 50%, #c084fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
    animation: welcomeIn 0.8s cubic-bezier(.16,1,.3,1) forwards, welcomeOut 0.7s cubic-bezier(.7,0,.3,1) 1.8s forwards;
    opacity: 0;
  }
  @keyframes welcomeIn {
    from { opacity: 0; transform: translateY(30px) scale(0.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes welcomeOut {
    from { opacity: 1; transform: scale(1); }
    to   { opacity: 0; transform: scale(1.08); }
  }
  #welcome-screen.done { display: none; }

  /* Main content */
  #main {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 40px 20px;
    opacity: 0;
    animation: mainIn 1s cubic-bezier(.16,1,.3,1) 2.7s forwards;
  }
  @keyframes mainIn {
    0%   { opacity: 0; transform: translateY(32px) scale(0.97); filter: blur(4px); }
    60%  { filter: blur(0); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  h1.site-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.5rem, 4vw, 2.8rem);
    font-weight: 900;
    background: linear-gradient(90deg, #b07fff, #7ec8c8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }

  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 22px;
    justify-content: center;
    align-items: stretch;
  }

  /* CARD BASE */
  .card {
    width: 190px;
    border-radius: 22px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    backdrop-filter: blur(18px);
    padding: 32px 20px 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    position: relative;
    overflow: hidden;
    transition: transform 0.55s cubic-bezier(.16,1,.3,1),
                box-shadow 0.55s cubic-bezier(.16,1,.3,1),
                border-color 0.4s ease;
    cursor: default;
    will-change: transform;
  }

  /* Shimmer sweep pseudo-element */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    border-radius: 22px;
    transition: opacity 0.5s ease;
  }
  /* Moving shine line */
  .card::after {
    content: '';
    position: absolute;
    top: 0; left: -75%;
    width: 50%; height: 100%;
    background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.07) 50%, transparent 100%);
    transform: skewX(-20deg);
    transition: none;
    pointer-events: none;
  }
  .card:hover::after {
    animation: cardShine 0.75s cubic-bezier(.16,1,.3,1) forwards;
  }
  @keyframes cardShine {
    0%   { left: -75%; opacity: 0; }
    15%  { opacity: 1; }
    100% { left: 130%; opacity: 0; }
  }

  .card:hover { transform: translateY(-10px) scale(1.03); }
  .card:hover::before { opacity: 1; }

  /* Logo hover float */
  .card:hover .logo-wrap {
    animation: logoFloat 0.6s cubic-bezier(.16,1,.3,1) forwards;
  }
  @keyframes logoFloat {
    0%   { transform: translateY(0) scale(1); }
    50%  { transform: translateY(-6px) scale(1.08); }
    100% { transform: translateY(-4px) scale(1.05); }
  }

  /* Card name color shift */
  .card-name { background-size: 300%; }
  .card-instagram .card-name { background: linear-gradient(90deg, #f58529, #dd2a7b, #f58529, #dd2a7b); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; background-position: 0%; }
  .card-discord   .card-name { background: linear-gradient(90deg, #7289da, #99aab5, #7289da, #99aab5); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; background-position: 0%; }
  .card-tiktok    .card-name { background: linear-gradient(90deg, #ff0050, #00f2ea, #ff0050, #00f2ea); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; background-position: 0%; }
  .card-spotify   .card-name { background: linear-gradient(90deg, #d4f540, #1DB954, #d4f540, #1DB954); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; background-position: 0%; }

  .card-instagram:hover .card-name,
  .card-discord:hover   .card-name,
  .card-tiktok:hover    .card-name,
  .card-spotify:hover   .card-name { animation: nameSlide 1.2s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes nameSlide {
    0%   { background-position: 0%; letter-spacing: 0.04em; }
    60%  { background-position: 180%; letter-spacing: 0.08em; }
    100% { background-position: 200%; letter-spacing: 0.06em; }
  }

  /* Button */
  .go-btn { background-size: 200% 100%; }
  .card-instagram .go-btn { background: linear-gradient(135deg, #f58529, #dd2a7b, #f58529); background-size: 200%; }
  .card-discord   .go-btn { background: linear-gradient(135deg, #5865F2, #1a2060, #5865F2); background-size: 200%; }
  .card-tiktok    .go-btn { background: linear-gradient(135deg, #ff0050, #00f2ea, #ff0050); background-size: 200%; }
  .card-spotify   .go-btn { background: linear-gradient(135deg, #1DB954, #e8e000, #1DB954); background-size: 200%; }
  .go-btn:hover { animation: btnShimmer 0.8s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes btnShimmer {
    0%   { background-position: 0% 50%;   filter: brightness(1)   saturate(1); transform: scale(1.1); }
    50%  { background-position: 100% 50%; filter: brightness(1.35) saturate(1.2); }
    100% { background-position: 0% 50%;   filter: brightness(1.15) saturate(1.1); transform: scale(1.1); }
  }

  /* Card glow halos */
  .card-instagram { box-shadow: var(--shadow); }
  .card-instagram:hover { box-shadow: 0 28px 70px rgba(245,133,41,0.55), 0 0 0 2px rgba(221,42,123,0.8), 0 0 40px rgba(221,42,123,0.2); border-color: rgba(221,42,123,0.5); }
  .card-instagram::before { background: linear-gradient(135deg, rgba(245,133,41,0.15), rgba(221,42,123,0.15)); }

  .card-discord:hover { box-shadow: 0 28px 70px rgba(88,101,242,0.6), 0 0 0 2px rgba(88,101,242,0.8), 0 0 40px rgba(88,101,242,0.2); border-color: rgba(88,101,242,0.5); }
  .card-discord::before { background: linear-gradient(135deg, rgba(88,101,242,0.15), rgba(20,30,80,0.12)); }

  .card-tiktok:hover { box-shadow: 0 28px 70px rgba(0,242,234,0.5), 0 0 0 2px rgba(0,242,234,0.75), 0 0 40px rgba(255,0,80,0.15); border-color: rgba(0,242,234,0.5); }
  .card-tiktok::before { background: linear-gradient(135deg, rgba(254,44,85,0.14), rgba(0,242,234,0.14)); }

  .card-spotify:hover { box-shadow: 0 28px 70px rgba(30,215,96,0.55), 0 0 0 2px rgba(212,245,64,0.7), 0 0 40px rgba(30,215,96,0.2); border-color: rgba(29,185,84,0.5); }
  .card-spotify::before { background: linear-gradient(135deg, rgba(30,215,96,0.15), rgba(212,245,64,0.13)); }

  /* SVG logos */
  .logo-wrap {
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    position: relative;
    z-index: 1;
    transition: transform 0.55s cubic-bezier(.16,1,.3,1),
                box-shadow 0.55s cubic-bezier(.16,1,.3,1),
                width 0.7s cubic-bezier(.16,1,.3,1),
                height 0.7s cubic-bezier(.16,1,.3,1),
                border-radius 0.7s cubic-bezier(.16,1,.3,1);
  }
  .logo-wrap svg {
    width: 44px; height: 44px;
    transition: width 0.6s cubic-bezier(.16,1,.3,1),
                height 0.6s cubic-bezier(.16,1,.3,1);
  }

  .logo-instagram { background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af); }
  .logo-discord   { background: linear-gradient(135deg, #5865F2, #1a2060); }
  .logo-tiktok    { background: linear-gradient(135deg, #010101, #ff0050); }
  .logo-spotify   { background: linear-gradient(135deg, #1DB954, #e8e000); }

  /* Logo hover ışık halkası */
  .card-instagram:hover .logo-wrap { box-shadow: 0 0 0 4px rgba(221,42,123,0.3), 0 8px 24px rgba(245,133,41,0.5); }
  .card-discord:hover   .logo-wrap { box-shadow: 0 0 0 4px rgba(88,101,242,0.35), 0 8px 24px rgba(88,101,242,0.5); }
  .card-tiktok:hover    .logo-wrap { box-shadow: 0 0 0 4px rgba(0,242,234,0.3), 0 8px 24px rgba(255,0,80,0.4); }
  .card-spotify:hover   .logo-wrap { box-shadow: 0 0 0 4px rgba(29,185,84,0.35), 0 8px 24px rgba(212,245,64,0.4); }

  .card-name {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.04em;
    position: relative;
    z-index: 1;
    transition: font-size 0.7s cubic-bezier(.16,1,.3,1),
                letter-spacing 0.7s cubic-bezier(.16,1,.3,1);
  }

  /* Go to Profile button */
  .go-btn {
    position: relative;
    z-index: 2;
    border: none;
    outline: none;
    border-radius: 50px;
    padding: 10px 20px;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(.16,1,.3,1),
                box-shadow 0.4s cubic-bezier(.16,1,.3,1),
                filter 0.3s ease;
    text-transform: uppercase;
    overflow: hidden;
  }
  /* Ripple on click */
  .go-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.3);
    opacity: 0;
    border-radius: 50px;
    transform: scale(0.5);
    transition: opacity 0.4s, transform 0.5s cubic-bezier(.16,1,.3,1);
  }
  .go-btn:active::after { opacity: 1; transform: scale(2); transition: none; }
  .go-btn:hover  { transform: scale(1.12) translateY(-2px); }
  .go-btn:active { transform: scale(0.95); }

  .card-instagram .go-btn { color: #fff; box-shadow: 0 4px 18px rgba(221,42,123,0.35); }
  .card-discord   .go-btn { color: #d0d8ff; box-shadow: 0 4px 18px rgba(88,101,242,0.35); }
  .card-tiktok    .go-btn { color: #fff; box-shadow: 0 4px 18px rgba(255,0,80,0.3); }
  .card-spotify   .go-btn { color: #1a1a00; box-shadow: 0 4px 18px rgba(30,215,96,0.35); }

  /* Hover'da buton glow */
  .card-instagram:hover .go-btn { box-shadow: 0 8px 28px rgba(221,42,123,0.55); }
  .card-discord:hover   .go-btn { box-shadow: 0 8px 28px rgba(88,101,242,0.55); }
  .card-tiktok:hover    .go-btn { box-shadow: 0 8px 28px rgba(255,0,80,0.5); }
  .card-spotify:hover   .go-btn { box-shadow: 0 8px 28px rgba(30,215,96,0.55); }

  /* Going to profile overlay */
  #going-overlay {
    position: fixed;
    inset: 0;
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s;
  }
  #going-overlay.show { opacity: 1; pointer-events: all; }
  #going-overlay .going-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 7vw, 5rem);
    font-weight: 900;
    background: linear-gradient(135deg, #b07fff 0%, #7ec8c8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: pulseText 1s ease infinite alternate;
  }
  @keyframes pulseText {
    from { opacity: 0.7; transform: scale(0.98); }
    to   { opacity: 1;   transform: scale(1.02); }
  }

  /* Dots loader */
  .dots { display: flex; gap: 10px; margin-top: 20px; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--text2);
    animation: bounce 1s ease infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%,100% { transform: translateY(0); opacity: 0.5; }
    50%      { transform: translateY(-10px); opacity: 1; }
  }

  /* ── Hakkımda Wrapper ── */
  #about-wrapper {
    margin-top: 10px;
    width: 100%;
    max-width: 700px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* yükseklik her zaman buton kadar — panel açılınca kayma olmaz */
    height: 52px;
    overflow: visible;
  }

  /* ── Kapalı Buton ── */
  #about-trigger {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 32px;
    border-radius: 16px;
    border: 1.5px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 4px 24px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.1);
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(.16,1,.3,1),
                box-shadow 0.3s cubic-bezier(.16,1,.3,1),
                border-color 0.3s;
  }
  .trig-label-text {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: clamp(1rem, 2.5vw, 1.5rem);
    letter-spacing: -0.01em;
    background: linear-gradient(90deg, #b07fff, #7ec8c8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  body.light .trig-label-text {
    background: linear-gradient(90deg, #6b25e0, #0a8080);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  body.light #about-trigger {
    background: rgba(255,255,255,0.85);
    border-color: rgba(107,37,224,0.4);
    box-shadow: 0 4px 24px rgba(100,60,200,0.2), inset 0 1px 0 rgba(255,255,255,0.9);
  }
  #about-trigger:hover {
    transform: scale(1.1) rotate(-2deg);
    box-shadow: 0 20px 60px rgba(176,127,255,0.45), 0 0 0 2px rgba(176,127,255,0.9);
    border-color: rgba(176,127,255,0.8);
  }
  #about-trigger.hidden {
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
  }

  /* About section - redesigned */
  .about-section {
    position: absolute;
    z-index: 150;
    left: 50%;
    top: 0;
    transform: translateX(-50%) scale(0.88);
    transform-origin: top center;
    background: var(--surface);
    border: 1.5px solid var(--border);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: 28px;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    overflow: hidden;
    width: min(700px, 90vw);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s cubic-bezier(.16,1,.3,1),
                transform 0.45s cubic-bezier(.16,1,.3,1);
  }
  .about-section.open {
    opacity: 1;
    pointer-events: all;
    transform: translateX(-50%) scale(1);
  }

  /* ── Çarpı / Kapat butonu ── */
  #about-close {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 10;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1rem;
    color: var(--text);
    opacity: 0;
    transform: rotate(-90deg) scale(0.6);
    transition: opacity 0.35s 0.25s, transform 0.4s 0.2s cubic-bezier(.16,1,.3,1),
                background 0.25s, box-shadow 0.25s;
    pointer-events: none;
    line-height: 1;
  }
  .about-section.open #about-close {
    opacity: 1;
    transform: rotate(0deg) scale(1);
    pointer-events: all;
  }
  #about-close:hover {
    background: rgba(255,80,80,0.15);
    border-color: rgba(255,100,100,0.5);
    box-shadow: 0 0 16px rgba(255,80,80,0.25);
    transform: rotate(90deg) scale(1.1) !important;
    color: #ff8080;
  }
  /* top gradient bar */
  .about-topbar {
    height: 5px;
    width: 100%;
    background: linear-gradient(90deg, #b07fff, #7ec8c8, #b07fff);
    background-size: 200%;
    animation: barSlide 4s linear infinite;
  }
  @keyframes barSlide {
    0%   { background-position: 0%; }
    100% { background-position: 200%; }
  }
  .about-inner {
    display: flex;
    align-items: center;
    gap: 32px;
    padding: 32px 36px;
    position: relative;
  }
  /* decorative corner glow */
  .about-inner::after {
    content: '';
    position: absolute;
    bottom: -40px; right: -40px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(126,200,200,0.12), transparent 70%);
    pointer-events: none;
  }
  .about-inner::before {
    content: '';
    position: absolute;
    top: -40px; left: -40px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(176,127,255,0.1), transparent 70%);
    pointer-events: none;
  }
  .about-avatar {
    flex-shrink: 0;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, #b07fff, #7ec8c8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.4rem;
    box-shadow: 0 0 0 4px rgba(176,127,255,0.15), 0 8px 32px rgba(126,200,200,0.25);
    animation: avatarPulse 3.5s cubic-bezier(.37,0,.63,1) infinite;
    position: relative;
    z-index: 1;
    transition: transform 0.4s cubic-bezier(.16,1,.3,1);
  }
  .about-avatar:hover { transform: scale(1.12) rotate(8deg); }
  @keyframes avatarPulse {
    0%,100% {
      box-shadow: 0 0 0 4px rgba(176,127,255,0.15), 0 8px 32px rgba(126,200,200,0.2);
      transform: scale(1);
    }
    50% {
      box-shadow: 0 0 0 10px rgba(176,127,255,0.22), 0 12px 44px rgba(126,200,200,0.38), 0 0 0 18px rgba(176,127,255,0.06);
      transform: scale(1.04);
    }
  }
  .about-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    z-index: 1;
  }
  .about-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    background: linear-gradient(90deg, #b07fff, #7ec8c8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .about-name {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 2.2rem;
    background: linear-gradient(90deg, #b07fff 0%, #7ec8c8 60%, #c084fc 100%);
    background-size: 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
    line-height: 1;
    animation: nameShimmer 6s ease-in-out infinite;
  }
  @keyframes nameShimmer {
    0%,100% { background-position: 0%; }
    50%     { background-position: 100%; }
  }
  .about-divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, rgba(176,127,255,0.4), rgba(126,200,200,0.4), transparent);
    border-radius: 2px;
    margin: 2px 0;
  }
  .about-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .about-tag {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 0.78rem;
    padding: 5px 14px;
    border-radius: 50px;
    letter-spacing: 0.04em;
    transition: transform 0.25s, box-shadow 0.25s;
    cursor: default;
  }
  .about-tag:hover { transform: translateY(-2px) scale(1.05); }
  .about-tag.tag-game {
    background: rgba(126,200,200,0.1);
    border: 1.5px solid rgba(126,200,200,0.4);
    color: #7ec8c8;
    box-shadow: 0 2px 12px rgba(126,200,200,0.15);
  }
  .about-tag.tag-pc {
    background: rgba(176,127,255,0.1);
    border: 1.5px solid rgba(176,127,255,0.4);
    color: #b07fff;
    box-shadow: 0 2px 12px rgba(176,127,255,0.15);
  }
  .about-tag.tag-age {
    background: rgba(200,184,240,0.08);
    border: 1.5px solid rgba(200,184,240,0.2);
    color: var(--text);
  }
  .about-footer {
    padding: 14px 36px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .about-footer span {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
    opacity: 0.45;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .about-footer-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: linear-gradient(135deg, #b07fff, #7ec8c8);
    opacity: 0.5;
  }

  /* main fade out */
  #main.fade-out { animation: mainOut 0.6s cubic-bezier(.7,0,.3,1) forwards; }
  @keyframes mainOut {
    to { opacity: 0; transform: scale(0.95) blur(8px); filter: blur(4px); }
  }

  /* ── Kart Çıkış Animasyonları ── */
  .card-exit-left  { animation: exitLeft  0.65s cubic-bezier(.55,0,.1,1) forwards !important; }
  .card-exit-right { animation: exitRight 0.65s cubic-bezier(.55,0,.1,1) forwards !important; }
  .card-exit-down  { animation: exitDown  0.65s cubic-bezier(.55,0,.1,1) forwards !important; }
  .card-exit-up    { animation: exitUp    0.65s cubic-bezier(.55,0,.1,1) forwards !important; }

  @keyframes exitLeft {
    0%   { opacity:1; transform: translateX(0)     scale(1)    rotate(0deg)  blur(0); filter: blur(0); }
    30%  { opacity:1; transform: translateX(-20px) scale(0.95) rotate(-3deg); filter: blur(0); }
    100% { opacity:0; transform: translateX(-160%) scale(0.75) rotate(-12deg); filter: blur(6px); }
  }
  @keyframes exitRight {
    0%   { opacity:1; transform: translateX(0)    scale(1)    rotate(0deg);  filter: blur(0); }
    30%  { opacity:1; transform: translateX(20px) scale(0.95) rotate(3deg);  filter: blur(0); }
    100% { opacity:0; transform: translateX(160%) scale(0.75) rotate(12deg); filter: blur(6px); }
  }
  @keyframes exitDown {
    0%   { opacity:1; transform: translateY(0)    scale(1)    rotate(0deg);  filter: blur(0); }
    30%  { opacity:1; transform: translateY(15px) scale(0.95) rotate(2deg);  filter: blur(0); }
    100% { opacity:0; transform: translateY(140%) scale(0.75) rotate(5deg);  filter: blur(6px); }
  }
  @keyframes exitUp {
    0%   { opacity:1; transform: translateY(0)     scale(1)    rotate(0deg);   filter: blur(0); }
    30%  { opacity:1; transform: translateY(-12px) scale(0.96) rotate(-1deg);  filter: blur(0); }
    100% { opacity:0; transform: translateY(-110%) scale(0.8)  rotate(-4deg);  filter: blur(6px); }
  }

  /* ── Kart Genişleme Animasyonu ── */
  /* Expand sırasında iç elementler büyür */
  .card.expanding .logo-wrap {
    transition: width 0.9s cubic-bezier(.16,1,.3,1) 0.2s,
                height 0.9s cubic-bezier(.16,1,.3,1) 0.2s,
                border-radius 0.7s cubic-bezier(.16,1,.3,1) 0.2s !important;
    width: 130px !important; height: 130px !important; border-radius: 32px !important;
  }
  .card.expanding .logo-wrap svg {
    transition: width 0.8s cubic-bezier(.16,1,.3,1) 0.25s,
                height 0.8s cubic-bezier(.16,1,.3,1) 0.25s !important;
    width: 86px !important; height: 86px !important;
  }
  .card.expanding .card-name {
    transition: font-size 0.8s cubic-bezier(.16,1,.3,1) 0.3s,
                letter-spacing 0.8s cubic-bezier(.16,1,.3,1) 0.3s !important;
    font-size: 2.6rem !important;
    letter-spacing: 0.1em !important;
  }
  /* Genişleyen kartın içinde ışık halkası */
  .card.expanding::before {
    animation: expandPulse 1.2s ease-in-out infinite !important;
    opacity: 1 !important;
  }
  @keyframes expandPulse {
    0%,100% { opacity: 0.5; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.05); }
  }

  /* ── Buton Morph ── */
  .go-btn.going {
    animation: btnMorph 0.5s cubic-bezier(.16,1,.3,1) forwards;
    pointer-events: none;
    white-space: nowrap;
  }
  @keyframes btnMorph {
    0%   { transform: scale(1);    opacity: 1; letter-spacing: 0.05em; }
    25%  { transform: scale(0.88); opacity: 0.4; letter-spacing: 0em; filter: blur(2px); }
    60%  { transform: scale(1.06); opacity: 0.9; letter-spacing: 0.07em; filter: blur(0); }
    100% { transform: scale(1.03); opacity: 1;   letter-spacing: 0.06em; }
  }
  .going-dots span {
    display: inline-block;
    animation: dotBounce 1s cubic-bezier(.16,1,.3,1) infinite;
  }
  .going-dots span:nth-child(2) { animation-delay: 0.15s; }
  .going-dots span:nth-child(3) { animation-delay: 0.30s; }
  @keyframes dotBounce {
    0%,100% { opacity:0.25; transform: translateY(0) scale(0.8); }
    45%     { opacity:1;    transform: translateY(-5px) scale(1.2); }
    65%     { transform: translateY(1px) scale(0.95); }
  }

  /* Particles.js */
  #particles-js {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    width: 100%;
    height: 100%;
  }

  /* ── Custom Cursor ───────────────────────────────── */
  * { cursor: none !important; }

  /* ══════════════════════════════════════════════════
     MOBİL VERSİYON — sadece touch cihazlara uygulanır
     ══════════════════════════════════════════════════ */
  @media (max-width: 768px), (hover: none) and (pointer: coarse) {

    /* ── Fare imlecini tamamen kaldır, normal dokunma davranışı ── */
    * { cursor: auto !important; }
    #cursor-dot,
    #cursor-ring { display: none !important; }

    /* ── Tema butonu ── */
    #theme-toggle {
      top: 14px;
      right: 14px;
      width: 46px;
      height: 46px;
    }

    /* ── Ana içerik padding ── */
    #main {
      padding: 80px 16px 40px;
      gap: 18px;
    }

    /* ── Site başlığı ── */
    h1.site-title {
      font-size: clamp(1.6rem, 7vw, 2.4rem);
      margin-bottom: 6px;
      text-align: center;
    }

    /* ── Kartlar: 2 sütunlu grid ── */
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
      max-width: 500px;
    }

    /* ── Kart boyutu ve dokunma alanı ── */
    .card {
      width: 100%;
      min-height: 170px;
      border-radius: 20px;
      padding: 24px 14px 20px;
      gap: 14px;
      /* Hover yerine basılınca efekt */
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.2s cubic-bezier(.16,1,.3,1),
                  box-shadow 0.2s cubic-bezier(.16,1,.3,1);
    }

    /* ── Dokunma sırasında hafif baskı efekti ── */
    .card:active {
      transform: scale(0.96) !important;
    }

    /* ── Logo ── */
    .logo-wrap {
      width: 52px;
      height: 52px;
      border-radius: 14px;
    }
    .logo-wrap svg {
      width: 34px;
      height: 34px;
    }

    /* ── Kart ismi ── */
    .card-name {
      font-size: 0.95rem;
    }

    /* ── Buton — parmakla kolay tıklanabilir ── */
    .go-btn {
      padding: 11px 16px;
      font-size: 0.75rem;
      width: 100%;
      border-radius: 50px;
      touch-action: manipulation;
    }
    .go-btn:active {
      transform: scale(0.95) !important;
    }

    /* ── About bölümü — yatay yerleşim ── */
    #about-wrapper {
      width: 100%;
      max-width: 500px;
    }
    #about-trigger {
      width: 100%;
      max-width: 500px;
      border-radius: 22px;
    }
    .about-section {
      width: 100%;
      max-width: 500px;
      border-radius: 22px;
      align-self: stretch;
      box-sizing: border-box;
    }
    .about-inner {
      flex-direction: row;
      align-items: center;
      text-align: left;
      gap: 16px;
      padding: 20px 18px;
    }
    .about-avatar {
      width: 64px;
      height: 64px;
      font-size: 1.7rem;
      flex-shrink: 0;
    }
    .about-avatar:hover { transform: none; }
    .about-content {
      align-items: flex-start;
      gap: 7px;
    }
    .about-name {
      font-size: 1.5rem;
    }
    .about-label {
      font-size: 0.68rem;
    }
    .about-tags {
      justify-content: flex-start;
    }
    .about-tag {
      font-size: 0.7rem;
      padding: 4px 10px;
    }
    .about-footer {
      padding: 10px 18px;
    }
    .about-footer span {
      font-size: 0.72rem;
    }

    /* ── Overlay metin ── */
    #going-overlay .going-text {
      font-size: clamp(1.8rem, 8vw, 3.5rem);
    }

    /* ── Blob'lar mobilde küçülsün ── */
    .blob1 { width: 280px; height: 280px; }
    .blob2 { width: 220px; height: 220px; }

    /* ── Kart hover glowları mobilde kapalı ── */
    .card-instagram:hover,
    .card-discord:hover,
    .card-tiktok:hover,
    .card-spotify:hover {
      transform: none;
      box-shadow: var(--shadow);
    }
    .card-instagram:hover .logo-wrap,
    .card-discord:hover   .logo-wrap,
    .card-tiktok:hover    .logo-wrap,
    .card-spotify:hover   .logo-wrap {
      box-shadow: none;
    }

    /* ── Kart active glow (dokunmada) ── */
    .card-instagram:active { box-shadow: 0 10px 40px rgba(245,133,41,0.45), 0 0 0 2px rgba(221,42,123,0.7); }
    .card-discord:active   { box-shadow: 0 10px 40px rgba(88,101,242,0.5),  0 0 0 2px rgba(88,101,242,0.7); }
    .card-tiktok:active    { box-shadow: 0 10px 40px rgba(0,242,234,0.4),   0 0 0 2px rgba(0,242,234,0.65); }
    .card-spotify:active   { box-shadow: 0 10px 40px rgba(30,215,96,0.45),  0 0 0 2px rgba(29,185,84,0.7); }

    /* ── Theme toggle hover efekti mobilde yok ── */
    #theme-toggle:hover {
      transform: none;
      box-shadow: 0 4px 24px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.15);
    }
    #theme-toggle:active {
      transform: scale(0.92) rotate(10deg);
    }
  }

  /* ── Çok küçük ekranlar (SE, eski Android) ── */
  @media (max-width: 360px) {
    .cards {
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .card {
      min-height: 155px;
      padding: 18px 10px 16px;
    }
    .logo-wrap { width: 44px; height: 44px; }
    .logo-wrap svg { width: 28px; height: 28px; }
    .go-btn { font-size: 0.68rem; padding: 9px 10px; }
  }

  #cursor-dot,
  #cursor-ring {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: opacity 0.3s;
  }

  /* Küçük merkez nokta */
  #cursor-dot {
    width: 8px;
    height: 8px;
    background: #fff;
    box-shadow: 0 0 8px rgba(176,127,255,0.9), 0 0 18px rgba(176,127,255,0.5);
    transition: transform 0.1s ease, background 0.2s, box-shadow 0.2s;
  }

  /* Dış halka */
  #cursor-ring {
    width: 36px;
    height: 36px;
    border: 2px solid rgba(176,127,255,0.6);
    background: rgba(126,200,200,0.06);
    backdrop-filter: blur(2px);
    transition: width 0.25s cubic-bezier(.16,1,.3,1),
                height 0.25s cubic-bezier(.16,1,.3,1),
                border-color 0.25s,
                background 0.25s,
                box-shadow 0.25s;
    box-shadow: 0 0 12px rgba(176,127,255,0.2);
  }

  /* Hover durumu – buton veya linkin üstünde */
  body.cursor-hover #cursor-ring {
    width: 56px;
    height: 56px;
    border-color: rgba(126,200,200,0.8);
    background: rgba(126,200,200,0.1);
    box-shadow: 0 0 24px rgba(126,200,200,0.35);
  }
  body.cursor-hover #cursor-dot {
    transform: translate(-50%, -50%) scale(1.6);
    background: #7ec8c8;
    box-shadow: 0 0 10px rgba(126,200,200,1), 0 0 24px rgba(126,200,200,0.6);
  }

  /* Tıklama durumu */
  body.cursor-click #cursor-ring {
    width: 28px;
    height: 28px;
    border-color: rgba(192,132,252,1);
    box-shadow: 0 0 28px rgba(192,132,252,0.7);
  }
  body.cursor-click #cursor-dot {
    transform: translate(-50%, -50%) scale(0.6);
  }
  /* ── Soldan Sağa Işık Süpürmesi ── */
  #flash-overlay {
    position: fixed;
    inset: 0;
    z-index: 400;
    pointer-events: none;
    opacity: 0;
    overflow: hidden;
  }
  #flash-overlay::after {
    content: '';
    position: absolute;
    top: 0;
    left: -60%;
    width: 40%;
    height: 100%;
    background: linear-gradient(
      105deg,
      transparent 0%,
      rgba(255,255,255,0.08) 30%,
      rgba(255,255,255,0.28) 50%,
      rgba(255,255,255,0.08) 70%,
      transparent 100%
    );
    transform: skewX(-12deg);
  }
  #flash-overlay.flash {
    opacity: 1;
    animation: sweepLight 0.9s cubic-bezier(.25,1,.5,1) forwards;
  }
  @keyframes sweepLight {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }
  #flash-overlay.flash::after {
    animation: sweepMove 0.9s cubic-bezier(.25,1,.5,1) forwards;
  }
  @keyframes sweepMove {
    0%   { left: -60%; }
    100% { left: 130%; }
  }

  /* ══════════════════════════════════════
     GİZLİ EASTER EGG — tema butonuna 6x
     ══════════════════════════════════════ */

  /* Hakkımda butonu büyüme animasyonu */
  #about-trigger.secret-grow {
    animation: secretGrowBtn 1.1s cubic-bezier(.16,1,.3,1) forwards !important;
    pointer-events: none !important;
    border-color: rgba(168,85,247,0.9) !important;
    z-index: 50;
  }
  @keyframes secretGrowBtn {
    0%   { transform: scale(1) rotate(0deg);
           box-shadow: 0 4px 24px rgba(0,0,0,0.25); }
    25%  { transform: scale(1.18) rotate(-4deg);
           box-shadow: 0 0 60px rgba(168,85,247,0.55), 0 0 0 3px rgba(168,85,247,0.5); }
    55%  { transform: scale(1.32) rotate(3deg);
           box-shadow: 0 0 90px rgba(168,85,247,0.75), 0 0 0 5px rgba(168,85,247,0.4); }
    80%  { transform: scale(1.28) rotate(-1deg); }
    100% { transform: scale(1.3) rotate(0deg);
           box-shadow: 0 0 80px rgba(168,85,247,0.6), 0 0 0 4px rgba(168,85,247,0.45); }
  }

  /* "Gizli bölme açılıyor" metni */
  .secret-reveal-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(0.7rem, 1.8vw, 0.95rem);
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #c084fc;
    text-shadow: 0 0 18px rgba(168,85,247,0.8), 0 0 40px rgba(168,85,247,0.4);
    margin-left: 14px;
    opacity: 0;
    animation: secretTextIn 0.5s cubic-bezier(.16,1,.3,1) 0.35s forwards;
    white-space: nowrap;
  }
  @keyframes secretTextIn {
    from { opacity: 0; transform: translateX(-12px) scale(0.9); }
    to   { opacity: 1; transform: translateX(0)     scale(1); }
  }

  /* Dönen dots loader gizli metin yanında */
  .secret-dots {
    display: inline-flex;
    gap: 4px;
    margin-left: 4px;
    vertical-align: middle;
  }
  .secret-dots span {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #a855f7;
    animation: secretDot 1s cubic-bezier(.16,1,.3,1) infinite;
    box-shadow: 0 0 8px rgba(168,85,247,0.7);
  }
  .secret-dots span:nth-child(2) { animation-delay: 0.18s; }
  .secret-dots span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes secretDot {
    0%,100% { transform: translateY(0) scale(0.8); opacity: 0.4; }
    45%     { transform: translateY(-6px) scale(1.2); opacity: 1; }
  }

  /* Tam ekran yıldızlar overlay */
  #secret-stars-overlay {
    position: fixed;
    inset: 0;
    z-index: 800;
    background: #080b12;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.9s cubic-bezier(.16,1,.3,1);
  }
  #secret-stars-overlay.active {
    opacity: 1;
    pointer-events: all;
  }
  #secret-stars-overlay iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* Geri dön butonu */
  #secret-stars-close {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 900;
    width: 48px;
    height: 48px;
    border-radius: 14px;

    pointer-events: none;

  #secret-stars-overlay.active #secret-stars-close {

</style>

<script>
  // ── Hakkımda Aç / Kapat ──────────────────────────────
  function openAbout() {
    const trigger = document.getElementById('about-trigger');
    const panel   = document.getElementById('about-section');
    trigger.style.visibility    = 'hidden';
    trigger.style.pointerEvents = 'none';
    panel.classList.add('open');
  }

  function closeAbout() {
    const trigger = document.getElementById('about-trigger');
    const panel   = document.getElementById('about-section');
    panel.classList.remove('open');
    setTimeout(() => {
      trigger.style.visibility    = '';
      trigger.style.pointerEvents = '';
    }, 450);
  }

  // Welcome screen dismiss after animation
  setTimeout(() => {
    document.getElementById('welcome-screen').classList.add('done');
  }, 2600);

  // ── Gece/Gündüz Modu ──────────────────────────────
  const themeBtn = document.getElementById('theme-toggle');
  const savedTheme = localStorage.getItem('theme') || 'dark';
  if (savedTheme === 'light') document.body.classList.add('light');

  // ── Gizli Easter Egg: tema butonuna 6x bas ──
  let _secretCount = 0;
  let _secretLocked = false;

  themeBtn.addEventListener('click', () => {
    document.body.classList.toggle('light');
    localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');

    if (_secretLocked) return;
    _secretCount++;
    if (_secretCount >= 6) {
      _secretCount = 0;
      _secretLocked = true;
      triggerSecretEasterEgg();
    }
  });

  function triggerSecretEasterEgg() {
    const title        = document.querySelector('.site-title');
    const cards        = document.querySelectorAll('.card');
    const aboutTrigger = document.getElementById('about-trigger');

    // 1) Kartlar farklı yönlere uçup gider (stagger)
    const exitClasses = ['card-exit-left','card-exit-right','card-exit-up','card-exit-down'];
    cards.forEach((card, i) => {
      setTimeout(() => card.classList.add(exitClasses[i % exitClasses.length]), i * 90);
    });

    // 2) Başlık yukarı uçar
    setTimeout(() => title.classList.add('card-exit-up'), 40);

    // 3) Hakkımda butonu büyür ve mesaj gösterir
    setTimeout(() => {
      aboutTrigger.classList.add('secret-grow');
      const msg = document.createElement('span');
      msg.className = 'secret-reveal-text';
      msg.innerHTML = 'Gizli bölme açılıyor<span class="secret-dots"><span></span><span></span><span></span></span>';
      aboutTrigger.appendChild(msg);
    }, 420);

    // 4) Yıldızlar overlay'i belirir (1.2 sn sonra buton animasyonu başlayalı)
    setTimeout(() => {
      document.getElementById('secret-stars-overlay').classList.add('active');
    }, 1550);

    // 5) Animasyon kalıntılarını temizle
    setTimeout(() => {
      cards.forEach(card => {
        card.className = card.className.replace(/card-exit-\w+/g, '').trim();
      });
      title.classList.remove('card-exit-up');
      aboutTrigger.classList.remove('secret-grow');
      const msg = aboutTrigger.querySelector('.secret-reveal-text');
      if (msg) msg.remove();
    }, 3200);
  }

  function closeSecretStars() {
    const overlay = document.getElementById('secret-stars-overlay');
    overlay.classList.remove('active');
    setTimeout(() => { _secretLocked = false; }, 950);
  }

  // Navigate with overlay (diğer kartlar için)
  function goToProfile(url) {
    const main = document.getElementById('main');
    const overlay = document.getElementById('going-overlay');
    main.classList.add('fade-out');
    setTimeout(() => { overlay.classList.add('show'); }, 350);
    setTimeout(() => {
      window.open(url, '_blank');
      setTimeout(() => {
        overlay.classList.remove('show');
        main.classList.remove('fade-out');
      }, 800);
    }, 1600);
  }

  // ── Evrensel Kart Genişleme Animasyonu ──────────────────────
  const cardGlows = {
    instagram: '0 0 140px rgba(245,133,41,0.65), 0 0 0 4px rgba(221,42,123,0.9)',
    discord:   '0 0 140px rgba(88,101,242,0.65), 0 0 0 4px rgba(88,101,242,0.9)',
    tiktok:    '0 0 140px rgba(0,242,234,0.55),  0 0 0 4px rgba(255,0,80,0.9)',
    spotify:   '0 0 140px rgba(30,215,96,0.65),  0 0 0 4px rgba(212,245,64,0.8)',
  };

  function goToInstagram(url) { expandCard('instagram', url); }
  function goToDiscord(url)   { expandCard('discord',   url); }
  function goToTikTok(url)    { expandCard('tiktok',    url); }
  function goToSpotify(url)   { expandCard('spotify',   url); }

  function expandCard(type, url) {
    const card    = document.querySelector('.card-' + type);
    const btn     = document.getElementById(type + '-btn');
    const title   = document.querySelector('.site-title');
    const allIds  = ['instagram', 'discord', 'tiktok', 'spotify'];
    const others  = allIds.filter(id => id !== type);
    const about   = document.getElementById('about-wrapper');

    // rect'i EN BAŞTA oku — animasyonlar başlamadan önce
    const rect = card.getBoundingClientRect();

    // Kartı hemen fixed konuma al (layout'tan çıkar, kayma olmaz)
    card.style.position       = 'fixed';
    card.style.left           = rect.left + 'px';
    card.style.top            = rect.top  + 'px';
    card.style.width          = rect.width + 'px';
    card.style.height         = rect.height + 'px';
    card.style.margin         = '0';
    card.style.zIndex         = '150';
    card.style.transition     = 'none';
    card.style.display        = 'flex';
    card.style.flexDirection  = 'column';
    card.style.alignItems     = 'center';
    card.style.justifyContent = 'center';
    card.style.willChange     = 'left, top, width, height';
    card.classList.add('expanding');

    const exitClasses = ['card-exit-left','card-exit-right','card-exit-down','card-exit-up'];

    // 1) Diğer kartlar sıralı (stagger) uçup gider
    others.forEach((id, i) => {
      const el = document.getElementById('card-' + id);
      if (!el) return;
      setTimeout(() => {
        el.classList.add(exitClasses[i % exitClasses.length]);
      }, i * 60);
    });
    setTimeout(() => { about.classList.add('card-exit-down'); }, 60);
    title.classList.add('card-exit-up');

    // 2) Buton → "Profil'e Gidiliyor..."
    setTimeout(() => {
      btn.classList.add('going');
      btn.innerHTML = 'Profil\'e Gidiliyor <span class="going-dots"><span>.</span><span>.</span><span>.</span></span>';
    }, 80);

    // 3) Tam ekrana genişlet
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const ease = 'cubic-bezier(.16,1,.3,1)';
        card.style.transition = `left 1s ${ease}, top 1s ${ease}, width 1s ${ease}, height 1s ${ease}, border-radius 1s ${ease}`;
        card.style.left         = '0';
        card.style.top          = '0';
        card.style.width        = '100vw';
        card.style.height       = '100vh';
        card.style.borderRadius = '0';
        card.style.boxShadow    = cardGlows[type]; // transition dışında — anlık
      });
    });

    // 5) Parlama flaşı — kart tam ekrana gerilince
    setTimeout(() => {
      const flash = document.getElementById('flash-overlay');
      flash.classList.remove('flash');
      flash.offsetWidth; // reflow
      flash.classList.add('flash');
    }, 1380);

    // 6) Sayfayı aç & sıfırla
    setTimeout(() => {
      window.open(url, '_blank');
      setTimeout(() => {
        card.style.transition = 'opacity 0.6s cubic-bezier(.7,0,.3,1), filter 0.6s';
        card.style.opacity    = '0';
        card.style.filter     = 'blur(8px)';
        setTimeout(() => {
          card.removeAttribute('style');
          card.classList.remove('expanding');
          others.forEach(id => {
            const el = document.getElementById('card-' + id);
            if (el) el.className = el.className.replace(/card-exit-\w+/g, '').trim();
          });
          about.classList.remove('card-exit-down');
          title.classList.remove('card-exit-up');
          btn.classList.remove('going');
          btn.innerHTML = 'Profil\'e Git';
        }, 620);
      }, 350);
    }, 2600);
  }

</script>
<!-- Secret Stars Overlay (Easter Egg) -->
<div id="secret-stars-overlay">
  <button id="secret-stars-close" onclick="closeSecretStars()" aria-label="Geri Dön">✕</button>
  <iframe id="secret-iframe" src="stars.html" title="Gizli Yıldızlar"></iframe>
</div>

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script>
  // Particles config
  function getParticlesConfig(isLight) {
    return {
      particles: {
        number: { value: 90, density: { enable: true, value_area: 800 } },
        color: { value: isLight ? ['#6b25e0', '#0a7070', '#9b3ff0', '#1a4a8a'] : ['#b07fff', '#7ec8c8', '#c084fc', '#ffffff'] },
        shape: { type: 'circle' },
        opacity: {
          value: isLight ? 0.85 : 0.5,
          random: true,
          anim: { enable: true, speed: 1, opacity_min: isLight ? 0.4 : 0.1, sync: false }
        },
        size: {
          value: isLight ? 4 : 3,
          random: true,
          anim: { enable: true, speed: 2, size_min: 0.5, sync: false }
        },
        line_linked: {
          enable: true,
          distance: 130,
          color: isLight ? '#6b25e0' : '#b07fff',
          opacity: isLight ? 0.35 : 0.12,
          width: isLight ? 1.5 : 1
        },
        move: {
          enable: true,
          speed: 1.2,
          direction: 'none',
          random: true,
          straight: false,
          out_mode: 'out',
          bounce: false
        }
      },
      interactivity: {
        detect_on: 'canvas',
        events: {
          onhover: { enable: true, mode: 'grab' },
          onclick: { enable: true, mode: 'push' },
          resize: true
        },
        modes: {
          grab: { distance: 140, line_linked: { opacity: isLight ? 0.7 : 0.35 } },
          push: { particles_nb: 4 }
        }
      },
      retina_detect: true
    };
  }

  // Mobilde particles sayısını azalt
  const isMobile = window.matchMedia('(max-width: 768px)').matches
    || window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  if (isMobile) {
    const baseCfg = getParticlesConfig(document.body.classList.contains('light'));
    baseCfg.particles.number.value = 30;
    baseCfg.particles.line_linked.enable = false;
    particlesJS('particles-js', baseCfg);
  } else {
    particlesJS('particles-js', getParticlesConfig(document.body.classList.contains('light')));
  }

  // Tema değişince particles'ı yeniden başlat
  function updateParticlesTheme() {
    const isLight = document.body.classList.contains('light');
    if (window.pJSDom && window.pJSDom.length > 0) {
      window.pJSDom[0].pJS.fn.vendors.destroypJS();
      window.pJSDom = [];
    }
    particlesJS('particles-js', getParticlesConfig(isLight));
  }
  document.getElementById('theme-toggle').addEventListener('click', updateParticlesTheme);

  // ── Custom Cursor — Sadece masaüstünde (touch olmayan cihazlar) ──
  const isTouchDevice = window.matchMedia('(hover: none) and (pointer: coarse)').matches
    || ('ontouchstart' in window && !window.matchMedia('(pointer: fine)').matches);

  (function () {
    if (isTouchDevice) return; // Mobilde cursor kodunu çalıştırma

    const dot  = document.getElementById('cursor-dot');
    const ring = document.getElementById('cursor-ring');

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let ringX  = mouseX;
    let ringY  = mouseY;

    // Anlık nokta pozisyonu
    document.addEventListener('mousemove', e => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      dot.style.left = mouseX + 'px';
      dot.style.top  = mouseY + 'px';
    });

    // Halka yavaşça takip eder (lerp)
    function lerp(a, b, t) { return a + (b - a) * t; }
    function animateRing() {
      ringX = lerp(ringX, mouseX, 0.12);
      ringY = lerp(ringY, mouseY, 0.12);
      ring.style.left = ringX + 'px';
      ring.style.top  = ringY + 'px';
      requestAnimationFrame(animateRing);
    }
    animateRing();

    // Hover: tıklanabilir elemanlar
    const hoverTargets = 'a, button, .card, .about-tag, .go-btn, .about-avatar';
    document.querySelectorAll(hoverTargets).forEach(el => {
      el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
      el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
    });

    // Tıklama efekti
    document.addEventListener('mousedown', () => document.body.classList.add('cursor-click'));
    document.addEventListener('mouseup',   () => document.body.classList.remove('cursor-click'));

    // Sayfa dışına çıkınca gizle
    document.addEventListener('mouseleave', () => {
      dot.style.opacity  = '0';
      ring.style.opacity = '0';
    });
    document.addEventListener('mouseenter', () => {
      dot.style.opacity  = '1';
      ring.style.opacity = '1';
    });
  })();
</script>
</body>
</html>
