<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İsababoli</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b12;
    --surface: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --shadow: 0 8px 40px rgba(0,0,0,0.5);
  }





  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    overflow: hidden;
  }
  body {
    background: var(--bg);
    min-height: 100vh;
    font-family: 'Playfair Display', serif;
    perspective: 1000px;
    perspective-origin: center center;
    transition: background 0.4s, color 0.4s;
  }




  /* ── Giriş Animasyonları ── */
  @keyframes entranceFromLeft {
    from { opacity: 0; transform: translateX(-110vw) scale(0.75) rotate(-6deg); }
    to   { opacity: 1; transform: translateX(0) scale(1) rotate(0deg); }
  }
  @keyframes entranceFromRight {
    from { opacity: 0; transform: translateX(110vw) scale(0.75) rotate(6deg); }
    to   { opacity: 1; transform: translateX(0) scale(1) rotate(0deg); }
  }
  @keyframes entranceFromTop {
    from { opacity: 0; transform: translateY(-110vh) scale(0.75) rotate(4deg); }
    to   { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
  }
  @keyframes entranceFromBottom {
    from { opacity: 0; transform: translateY(110vh) scale(0.75) rotate(-4deg); }
    to   { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
  }
  @keyframes entranceFromTopRight {
    from { opacity: 0; transform: translate(80px, -80px) scale(0.5) rotate(20deg); }
    to   { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
  }
  @keyframes titleEntrance {
    from { opacity: 0; transform: translateY(-30px) scale(0.88); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── Kart Giriş Stilleri ── */
  #card-instagram {
    opacity: 0;
    animation: entranceFromBottom 1s cubic-bezier(.16,1,.3,1) 0.3s forwards;
  }
  #card-discord {
    opacity: 0;
    animation: entranceFromBottom 1s cubic-bezier(.16,1,.3,1) 0.55s forwards;
  }
  #card-tiktok {
    opacity: 0;
    animation: entranceFromBottom 1s cubic-bezier(.16,1,.3,1) 0.8s forwards;
  }
  #card-spotify {
    opacity: 0;
    animation: entranceFromBottom 1s cubic-bezier(.16,1,.3,1) 1.05s forwards;
  }
  #card-facebook {
    opacity: 0;
    animation: entranceFromBottom 1s cubic-bezier(.16,1,.3,1) 1.3s forwards;
  }

  /* ── Site Başlığı: Kutu İniş + Typewriter ── */
  .title-box-wrap {
    --parallax-x: 0px;
    --parallax-y: 0px;
    opacity: 0;
    transform: translate3d(var(--parallax-x), var(--parallax-y), 0) scale(1);
    animation: titleBoxDrop 0.85s cubic-bezier(.16,1,.3,1) 0.15s forwards;
    border-radius: 16px;
    padding: 12px 28px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    box-shadow:
      0 8px 32px rgba(0,0,0,0.4),
      inset 0 1.5px 0 rgba(255,255,255,0.22),
      inset 0 -1px 0 rgba(0,0,0,0.18);
    position: relative;
    overflow: hidden;
    transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  }
  /* Sol üst: mor blob */
  .title-box-wrap::before {
    content: '';
    position: absolute;
    top: -40px;
    left: -40px;
    width: 120px;
    height: 120px;
    background: #7b3ff2;
    border-radius: 50%;
    filter: blur(38px);
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
  }
  /* Sağ alt: turkuaz blob */
  .title-box-wrap::after {
    content: '';
    position: absolute;
    bottom: -40px;
    right: -40px;
    width: 120px;
    height: 120px;
    background: #00c8c8;
    border-radius: 50%;
    filter: blur(38px);
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
  }
  .title-box-wrap h1 {
    position: relative;
    z-index: 1;
  }
  @keyframes titleBoxDrop {
    from { opacity: 0; transform: translateY(-120px) scale(0.92); }
    to   { opacity: 1; transform: translate3d(var(--parallax-x), var(--parallax-y), 0) scale(1); }
  }

  /* Typewriter cursor */
  h1.site-title::after {
    content: '|';
    display: inline-block;
    margin-left: 2px;
    color: #7ec8c8;
    animation: cursorBlink 0.75s step-end infinite;
    opacity: 0;
  }
  h1.site-title.typing::after {
    opacity: 1;
  }
  h1.site-title.done-typing::after {
    animation: cursorBlink 0.75s step-end infinite;
    opacity: 1;
  }
  @keyframes cursorBlink {
    0%, 100% { opacity: 0; }
    50%       { opacity: 1; }
  }

  /* ── Bildirim (Hoş Geldiniz) ── */
  #welcome-notif {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 600;
    display: flex;
    align-items: stretch;
    gap: 0;
    background: rgba(12, 8, 26, 0.78);
    backdrop-filter: blur(32px);
    -webkit-backdrop-filter: blur(32px);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px;
    padding: 0;
    min-width: 210px;
    overflow: hidden;
    opacity: 0;
    transform: translateY(-90px) scale(0.86);
    pointer-events: none;
    box-shadow: 0 16px 56px rgba(0,0,0,0.55), 0 0 0 1px rgba(176,127,255,0.06);
    animation: notifSlideIn 0.8s cubic-bezier(.16,1,.3,1) 2.2s forwards,
               notifFadeOut 0.6s cubic-bezier(.7,0,.3,1) 5.0s forwards;
  }
  @keyframes notifSlideIn {
    0%   { opacity: 0; transform: translateY(-90px) scale(0.86); }
    50%  { opacity: 1; transform: translateY(5px) scale(1.01); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes notifFadeOut {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to   { opacity: 0; transform: translateY(-80px) scale(0.84); }
  }
  /* Sol aksan çizgisi */
  .notif-accent {
    width: 3px;
    background: linear-gradient(180deg, #b07fff 0%, #7ec8c8 100%);
    flex-shrink: 0;
    border-radius: 0;
  }
  .notif-body {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 14px 18px;
  }
  .notif-app-name {
    font-family: 'Playfair Display', serif;
    font-size: 0.62rem;
    font-weight: 700;
    color: rgba(176,127,255,0.75);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .notif-message {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 900;
    color: rgba(255,255,255,0.9);
    letter-spacing: 0.01em;
    line-height: 1.2;
  }

  /* Main content */
  #main {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 40px 20px;
  }

  h1.site-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.5rem, 4vw, 2.8rem);
    font-weight: 900;
    background: linear-gradient(90deg, #b07fff, #7ec8c8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }

  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 22px;
    justify-content: center;
    align-items: stretch;
  }

  .mobile-profile-card {
    display: none;
  }

  /* CARD BASE — Liquid Glass */
  .card {
    --parallax-x: 0px;
    --parallax-y: 0px;
    --tilt-rx: 0deg;
    --tilt-ry: 0deg;
    --hover-y: 0px;
    --hover-scale: 1;
    --touch-scale: 1;
    width: 190px;
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.055);
    border: 1px solid rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(32px) saturate(180%) brightness(1.06);
    -webkit-backdrop-filter: blur(32px) saturate(180%) brightness(1.06);
    box-shadow:
      0 8px 32px rgba(0,0,0,0.45),
      inset 0 1.5px 0 rgba(255,255,255,0.26),
      inset 0 -1px 0 rgba(0,0,0,0.22),
      inset 1px 0 0 rgba(255,255,255,0.13),
      inset -1px 0 0 rgba(0,0,0,0.08);
    padding: 32px 20px 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    position: relative;
    overflow: hidden;
    transform: translate3d(var(--parallax-x), var(--parallax-y), 0)
               rotateX(var(--tilt-rx))
               rotateY(var(--tilt-ry))
               translateY(var(--hover-y))
               scale(var(--hover-scale))
               scale(var(--touch-scale));
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(.16,1,.3,1),
                box-shadow 0.45s cubic-bezier(.16,1,.3,1),
                border-color 0.35s ease;
    will-change: transform;
    contain: layout style paint;
  }

  /* --- YENI: 3D Tilt Glare --- */
  .card.tilt-active {
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.45s cubic-bezier(.16,1,.3,1),
                border-color 0.35s ease;
  }
  .card.tilt-resetting {
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.45s cubic-bezier(.16,1,.3,1),
                border-color 0.35s ease;
  }
  .card-glare {
    position: absolute;
    inset: 0;
    z-index: 3;
    border-radius: inherit;
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: overlay;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0));
    transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), background 0.12s linear;
  }

  /* --- YENI: Efekt resetleri --- */
  @media (prefers-reduced-motion: reduce) {
    #particle-canvas { display: none; }
    .title-box-wrap {
      --parallax-x: 0px;
      --parallax-y: 0px;
    }
    .card {
      --parallax-x: 0px;
      --parallax-y: 0px;
      --tilt-rx: 0deg;
      --tilt-ry: 0deg;
    }
    .card-glare { display: none; }
  }

  /* Liquid Glass: specular top sheen (daima görünür) */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 22px;
    background: linear-gradient(
      160deg,
      rgba(255,255,255,0.16) 0%,
      rgba(255,255,255,0.04) 35%,
      transparent 55%
    );
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.5s ease;
  }
  /* Moving shine line */
  .card::after {
    content: '';
    position: absolute;
    top: 0; left: -75%;
    width: 50%; height: 100%;
    background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.07) 50%, transparent 100%);
    transform: skewX(-20deg);
    transition: none;
    pointer-events: none;
  }
  .card:hover::after {
    animation: cardShine 0.75s cubic-bezier(.16,1,.3,1) forwards;
  }
  @keyframes cardShine {
    0%   { left: -75%; opacity: 0; }
    15%  { opacity: 1; }
    100% { left: 130%; opacity: 0; }
  }

  .card:hover { 
    --hover-y: -10px;
    --hover-scale: 1.03;
    background: rgba(255, 255, 255, 0.09);
    border-color: rgba(255, 255, 255, 0.26);
    box-shadow:
      0 20px 60px rgba(0,0,0,0.5),
      inset 0 1.5px 0 rgba(255,255,255,0.34),
      inset 0 -1px 0 rgba(0,0,0,0.2),
      inset 1px 0 0 rgba(255,255,255,0.18),
      inset -1px 0 0 rgba(0,0,0,0.06);
  }

  /* Logo hover float */
  .card:hover .logo-wrap {
    animation: logoFloat 0.6s cubic-bezier(.16,1,.3,1) forwards;
  }
  @keyframes logoFloat {
    0%   { transform: translateY(0) scale(1); }
    50%  { transform: translateY(-6px) scale(1.08); }
    100% { transform: translateY(-4px) scale(1.05); }
  }

  /* Card name color shift */
  .card-instagram .card-name { background: linear-gradient(90deg, #f58529, #dd2a7b, #f58529, #dd2a7b); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; background-position: 0%; }
  .card-discord   .card-name { background: linear-gradient(90deg, #7289da, #99aab5, #7289da, #99aab5); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; background-position: 0%; }
  .card-tiktok    .card-name { background: linear-gradient(90deg, #ff0050, #00f2ea, #ff0050, #00f2ea); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; background-position: 0%; }
  .card-spotify   .card-name { background: linear-gradient(90deg, #d4f540, #1DB954, #d4f540, #1DB954); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; background-position: 0%; }
  .card-facebook  .card-name { background: linear-gradient(90deg, #1877f2, #42b0ff, #1877f2, #42b0ff); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; background-position: 0%; }

  .card-instagram:hover .card-name,
  .card-discord:hover   .card-name,
  .card-tiktok:hover    .card-name,
  .card-spotify:hover   .card-name,
  .card-facebook:hover  .card-name { animation: nameSlide 1.2s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes nameSlide {
    0%   { background-position: 0%; letter-spacing: 0.04em; }
    60%  { background-position: 180%; letter-spacing: 0.08em; }
    100% { background-position: 200%; letter-spacing: 0.06em; }
  }

  /* Button */
  .card-instagram .go-btn { background: linear-gradient(135deg, #f58529, #dd2a7b, #f58529); background-size: 200%; }
  .card-discord   .go-btn { background: linear-gradient(135deg, #5865F2, #1a2060, #5865F2); background-size: 200%; }
  .card-tiktok    .go-btn { background: linear-gradient(135deg, #ff0050, #00f2ea, #ff0050); background-size: 200%; }
  .card-spotify   .go-btn { background: linear-gradient(135deg, #1DB954, #e8e000, #1DB954); background-size: 200%; }
  .card-facebook  .go-btn { background: linear-gradient(135deg, #1877f2, #42b0ff, #1877f2); background-size: 200%; }
  .go-btn:hover { animation: btnShimmer 0.8s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes btnShimmer {
    0%   { background-position: 0% 50%;   filter: brightness(1)   saturate(1); transform: scale(1.1); }
    50%  { background-position: 100% 50%; filter: brightness(1.35) saturate(1.2); }
    100% { background-position: 0% 50%;   filter: brightness(1.15) saturate(1.1); transform: scale(1.1); }
  }

  /* Card glow halos */
  .card-instagram { box-shadow: var(--shadow); }
  .card-instagram:hover { box-shadow: 0 28px 70px rgba(245,133,41,0.55), 0 0 0 2px rgba(221,42,123,0.8), 0 0 40px rgba(221,42,123,0.2); border-color: rgba(221,42,123,0.5); }
  .card-instagram::before { background: linear-gradient(135deg, rgba(245,133,41,0.15), rgba(221,42,123,0.15)); }

  .card-discord:hover { box-shadow: 0 28px 70px rgba(88,101,242,0.6), 0 0 0 2px rgba(88,101,242,0.8), 0 0 40px rgba(88,101,242,0.2); border-color: rgba(88,101,242,0.5); }
  .card-discord::before { background: linear-gradient(135deg, rgba(88,101,242,0.15), rgba(20,30,80,0.12)); }

  .card-tiktok:hover { box-shadow: 0 28px 70px rgba(0,242,234,0.5), 0 0 0 2px rgba(0,242,234,0.75), 0 0 40px rgba(255,0,80,0.15); border-color: rgba(0,242,234,0.5); }
  .card-tiktok::before { background: linear-gradient(135deg, rgba(254,44,85,0.14), rgba(0,242,234,0.14)); }

  .card-spotify:hover { box-shadow: 0 28px 70px rgba(30,215,96,0.55), 0 0 0 2px rgba(212,245,64,0.7), 0 0 40px rgba(30,215,96,0.2); border-color: rgba(29,185,84,0.5); }
  .card-spotify::before { background: linear-gradient(135deg, rgba(30,215,96,0.15), rgba(212,245,64,0.13)); }

  .card-facebook:hover { box-shadow: 0 28px 70px rgba(24,119,242,0.6), 0 0 0 2px rgba(24,119,242,0.85), 0 0 40px rgba(66,176,255,0.2); border-color: rgba(24,119,242,0.5); }
  .card-facebook::before { background: linear-gradient(135deg, rgba(24,119,242,0.15), rgba(66,176,255,0.13)); }

  /* SVG logos */
  .logo-wrap {
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    position: relative;
    z-index: 1;
    transition: transform 0.55s cubic-bezier(.16,1,.3,1),
                box-shadow 0.55s cubic-bezier(.16,1,.3,1),
                width 0.7s cubic-bezier(.16,1,.3,1),
                height 0.7s cubic-bezier(.16,1,.3,1),
                border-radius 0.7s cubic-bezier(.16,1,.3,1);
  }
  .logo-wrap svg {
    width: 44px; height: 44px;
    transition: width 0.6s cubic-bezier(.16,1,.3,1),
                height 0.6s cubic-bezier(.16,1,.3,1);
  }

  .logo-instagram { background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af); }
  .logo-discord   { background: linear-gradient(135deg, #5865F2, #1a2060); }
  .logo-tiktok    { background: linear-gradient(135deg, #010101, #ff0050); }
  .logo-spotify   { background: linear-gradient(135deg, #1DB954, #e8e000); }
  .logo-facebook  { background: linear-gradient(135deg, #1877f2, #0a4fc4); }

  /* Logo hover ışık halkası */
  .card-instagram:hover .logo-wrap { box-shadow: 0 0 0 4px rgba(221,42,123,0.3), 0 8px 24px rgba(245,133,41,0.5); }
  .card-discord:hover   .logo-wrap { box-shadow: 0 0 0 4px rgba(88,101,242,0.35), 0 8px 24px rgba(88,101,242,0.5); }
  .card-tiktok:hover    .logo-wrap { box-shadow: 0 0 0 4px rgba(0,242,234,0.3), 0 8px 24px rgba(255,0,80,0.4); }
  .card-spotify:hover   .logo-wrap { box-shadow: 0 0 0 4px rgba(29,185,84,0.35), 0 8px 24px rgba(212,245,64,0.4); }
  .card-facebook:hover  .logo-wrap { box-shadow: 0 0 0 4px rgba(24,119,242,0.4), 0 8px 24px rgba(66,176,255,0.5); }

  .card-name {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.04em;
    position: relative;
    z-index: 1;
    transition: font-size 0.7s cubic-bezier(.16,1,.3,1),
                letter-spacing 0.7s cubic-bezier(.16,1,.3,1);
  }

  /* Go to Profile button */
  .go-btn {
    position: relative;
    z-index: 2;
    border: none;
    outline: none;
    border-radius: 50px;
    padding: 10px 20px;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.05em;
    transition: transform 0.4s cubic-bezier(.16,1,.3,1),
                box-shadow 0.4s cubic-bezier(.16,1,.3,1),
                filter 0.3s ease;
    text-transform: uppercase;
    overflow: hidden;
  }
  /* Ripple on click */
  .go-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.3);
    opacity: 0;
    border-radius: 50px;
    transform: scale(0.5);
    transition: opacity 0.4s, transform 0.5s cubic-bezier(.16,1,.3,1);
  }
  .go-btn:active::after { opacity: 1; transform: scale(2); transition: none; }
  .go-btn:hover  { transform: scale(1.12) translateY(-2px); }
  .go-btn:active { transform: scale(0.95); }

  .card-instagram .go-btn { color: #fff; box-shadow: 0 4px 18px rgba(221,42,123,0.35); }
  .card-discord   .go-btn { color: #d0d8ff; box-shadow: 0 4px 18px rgba(88,101,242,0.35); }
  .card-tiktok    .go-btn { color: #fff; box-shadow: 0 4px 18px rgba(255,0,80,0.3); }
  .card-spotify   .go-btn { color: #1a1a00; box-shadow: 0 4px 18px rgba(30,215,96,0.35); }
  .card-facebook  .go-btn { color: #fff; box-shadow: 0 4px 18px rgba(24,119,242,0.4); }

  /* Hover'da buton glow */
  .card-instagram:hover .go-btn { box-shadow: 0 8px 28px rgba(221,42,123,0.55); }
  .card-discord:hover   .go-btn { box-shadow: 0 8px 28px rgba(88,101,242,0.55); }
  .card-tiktok:hover    .go-btn { box-shadow: 0 8px 28px rgba(255,0,80,0.5); }
  .card-spotify:hover   .go-btn { box-shadow: 0 8px 28px rgba(30,215,96,0.55); }
  .card-facebook:hover  .go-btn { box-shadow: 0 8px 28px rgba(24,119,242,0.6); }

  /* ── Kart Çıkış Animasyonları ── */
  .card-exit-left  { will-change: transform, opacity; animation: exitLeft  0.55s cubic-bezier(.55,0,.1,1) forwards !important; }
  .card-exit-right { will-change: transform, opacity; animation: exitRight 0.55s cubic-bezier(.55,0,.1,1) forwards !important; }
  .card-exit-down  { will-change: transform, opacity; animation: exitDown  0.55s cubic-bezier(.55,0,.1,1) forwards !important; }
  .card-exit-up    { will-change: transform, opacity; animation: exitUp    0.55s cubic-bezier(.55,0,.1,1) forwards !important; }

  @keyframes exitLeft {
    0%   { opacity:1; transform: translateX(0)     scale(1)    rotate(0deg); }
    30%  { opacity:1; transform: translateX(-20px) scale(0.95) rotate(-3deg); }
    100% { opacity:0; transform: translateX(-160%) scale(0.75) rotate(-12deg); }
  }
  @keyframes exitRight {
    0%   { opacity:1; transform: translateX(0)    scale(1)    rotate(0deg); }
    30%  { opacity:1; transform: translateX(20px) scale(0.95) rotate(3deg); }
    100% { opacity:0; transform: translateX(160%) scale(0.75) rotate(12deg); }
  }
  @keyframes exitDown {
    0%   { opacity:1; transform: translateY(0)    scale(1)    rotate(0deg); }
    30%  { opacity:1; transform: translateY(15px) scale(0.95) rotate(2deg); }
    100% { opacity:0; transform: translateY(140%) scale(0.75) rotate(5deg); }
  }
  @keyframes exitUp {
    0%   { opacity:1; transform: translateY(0)     scale(1)    rotate(0deg); }
    30%  { opacity:1; transform: translateY(-12px) scale(0.96) rotate(-1deg); }
    100% { opacity:0; transform: translateY(-110%) scale(0.8)  rotate(-4deg); }
  }

  /* ── Kart Genişleme Animasyonu ── */
  /* Expand sırasında iç elementler büyür */
  .card.expanding .logo-wrap {
    transition: width 0.9s cubic-bezier(.16,1,.3,1) 0.2s,
                height 0.9s cubic-bezier(.16,1,.3,1) 0.2s,
                border-radius 0.7s cubic-bezier(.16,1,.3,1) 0.2s !important;
    width: 130px !important; height: 130px !important; border-radius: 32px !important;
    will-change: width, height;
  }
  .card.expanding .logo-wrap svg {
    transition: width 0.8s cubic-bezier(.16,1,.3,1) 0.25s,
                height 0.8s cubic-bezier(.16,1,.3,1) 0.25s !important;
    width: 86px !important; height: 86px !important;
  }
  .card.expanding .card-name {
    transition: font-size 0.8s cubic-bezier(.16,1,.3,1) 0.3s,
                letter-spacing 0.8s cubic-bezier(.16,1,.3,1) 0.3s !important;
    font-size: 2.6rem !important;
    letter-spacing: 0.1em !important;
  }
  /* Genişleyen kartın içinde ışık halkası */
  .card.expanding::before {
    animation: expandPulse 1.2s ease-in-out infinite !important;
    opacity: 1 !important;
  }
  @keyframes expandPulse {
    0%,100% { opacity: 0.5; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.05); }
  }

  /* ── Buton Morph ── */
  .go-btn.going {
    animation: btnMorph 0.5s cubic-bezier(.16,1,.3,1) forwards;
    pointer-events: none;
    white-space: nowrap;
  }
  @keyframes btnMorph {
    0%   { transform: scale(1);    opacity: 1; letter-spacing: 0.05em; }
    25%  { transform: scale(0.88); opacity: 0.4; letter-spacing: 0em; }
    60%  { transform: scale(1.06); opacity: 0.9; letter-spacing: 0.07em; }
    100% { transform: scale(1.03); opacity: 1;   letter-spacing: 0.06em; }
  }
  .going-dots span {
    display: inline-block;
    animation: dotBounce 1s cubic-bezier(.16,1,.3,1) infinite;
  }
  .going-dots span:nth-child(2) { animation-delay: 0.15s; }
  .going-dots span:nth-child(3) { animation-delay: 0.30s; }
  @keyframes dotBounce {
    0%,100% { opacity:0.25; transform: translateY(0) scale(0.8); }
    45%     { opacity:1;    transform: translateY(-5px) scale(1.2); }
    65%     { transform: translateY(1px) scale(0.95); }
  }

  /* ══════════════════════════════════════════════════
     MOBİL VERSİYON — sadece touch cihazlara uygulanır
     ══════════════════════════════════════════════════ */
  @media (max-width: 768px), (hover: none) and (pointer: coarse) {

    /* ── Ana içerik padding ── */
    #main {
      padding: 145px 16px 40px;
      gap: 18px;
      justify-content: flex-start;
    }

    /* ── Site başlığı ── */
    h1.site-title {
      font-size: clamp(1.6rem, 7vw, 2.4rem);
      margin-bottom: 6px;
      text-align: center;
    }

    /* ── Kartlar: 2 sütunlu grid ── */
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
      max-width: 500px;
    }

    /* ── Kart boyutu ve dokunma alanı ── */
    .card {
      width: 100%;
      min-height: 170px;
      border-radius: 20px;
      padding: 24px 14px 20px;
      gap: 14px;
      /* Hover yerine basılınca efekt */
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.2s cubic-bezier(.16,1,.3,1),
                  box-shadow 0.2s cubic-bezier(.16,1,.3,1);
    }

    /* ── Dokunma sırasında hafif baskı efekti ── */
    .card:active {
      --touch-scale: 0.96;
    }

    /* ── Logo ── */
    .logo-wrap {
      width: 52px;
      height: 52px;
      border-radius: 14px;
    }
    .logo-wrap svg {
      width: 34px;
      height: 34px;
    }

    /* ── Kart ismi ── */
    .card-name {
      font-size: 0.95rem;
    }

    /* ── Buton — parmakla kolay tıklanabilir ── */
    .go-btn {
      padding: 11px 16px;
      font-size: 0.75rem;
      width: 100%;
      border-radius: 50px;
      touch-action: manipulation;
    }
    .go-btn:active {
      transform: scale(0.95) !important;
    }

    /* ── Kart hover glowları mobilde kapalı ── */
    .card-instagram:hover,
    .card-discord:hover,
    .card-tiktok:hover,
    .card-spotify:hover,
    .card-facebook:hover {
      --hover-y: 0px;
      --hover-scale: 1;
      --tilt-rx: 0deg;
      --tilt-ry: 0deg;
      box-shadow: var(--shadow);
    }
    .card-instagram:hover .logo-wrap,
    .card-discord:hover   .logo-wrap,
    .card-tiktok:hover    .logo-wrap,
    .card-spotify:hover   .logo-wrap,
    .card-facebook:hover  .logo-wrap {
      box-shadow: none;
    }

    /* ── Kart active glow (dokunmada) ── */
    .card-instagram:active { box-shadow: 0 10px 40px rgba(245,133,41,0.45), 0 0 0 2px rgba(221,42,123,0.7); }
    .card-discord:active   { box-shadow: 0 10px 40px rgba(88,101,242,0.5),  0 0 0 2px rgba(88,101,242,0.7); }
    .card-tiktok:active    { box-shadow: 0 10px 40px rgba(0,242,234,0.4),   0 0 0 2px rgba(0,242,234,0.65); }
    .card-spotify:active   { box-shadow: 0 10px 40px rgba(30,215,96,0.45),  0 0 0 2px rgba(29,185,84,0.7); }
    .card-facebook:active  { box-shadow: 0 10px 40px rgba(24,119,242,0.5),  0 0 0 2px rgba(24,119,242,0.7); }

  }

  /* ── Çok küçük ekranlar (SE, eski Android) ── */
  @media (max-width: 360px) {
    .cards {
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .card {
      min-height: 155px;
      padding: 18px 10px 16px;
    }
    .logo-wrap { width: 44px; height: 44px; }
    .logo-wrap svg { width: 28px; height: 28px; }
    .go-btn { font-size: 0.68rem; padding: 9px 10px; }
  }

  @media (max-width: 768px), (hover: none) and (pointer: coarse) {
    body {
      min-height: 100svh;
      background: #061426;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;

        radial-gradient(circle at 14% 8%, rgba(89, 190, 170, 0.22), transparent 28%),

    #main {

    .title-box-wrap,

    .mobile-profile-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: min(91vw, 390px);
      min-height: min(59svh, 430px);
      padding: clamp(42px, 8svh, 66px) clamp(18px, 6vw, 32px) 30px;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      border-radius: 28px;
      color: #fff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background:
        linear-gradient(150deg, rgba(91, 119, 144, 0.46), rgba(9, 28, 52, 0.58) 45%, rgba(4, 18, 36, 0.7));
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(34px) saturate(165%) brightness(1.04);
      -webkit-backdrop-filter: blur(34px) saturate(165%) brightness(1.04);
      box-shadow:
        0 26px 80px rgba(0, 0, 0, 0.44),
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        inset 0 -1px 0 rgba(0, 0, 0, 0.22),
        inset 1px 0 0 rgba(255, 255, 255, 0.08);
    }

    .mobile-profile-card::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 18% 0%, rgba(117, 162, 167, 0.22), transparent 34%),
        radial-gradient(circle at 82% 94%, rgba(22, 82, 133, 0.3), transparent 40%),
        linear-gradient(160deg, rgba(255, 255, 255, 0.1), transparent 42%);
      opacity: 0.9;
    }

    .mobile-profile-card::after {
      content: '';
      position: absolute;
      top: -35%;
      left: -55%;
      z-index: 0;
      width: 44%;
      height: 170%;
      transform: rotate(18deg);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      opacity: 0.65;
      pointer-events: none;
    }

    .mobile-profile-card > * {
      position: relative;
      z-index: 1;
    }

    body.not-loaded .mobile-profile-card {
      opacity: 0;
      transform: translateY(34px) scale(0.96);
    }

    body:not(.not-loaded) .mobile-profile-card {
      animation: mobileProfileReveal 0.82s cubic-bezier(.16,1,.3,1) 0.12s both;
    }

    body:not(.not-loaded) .mobile-profile-card::after {
      animation: mobileGlassSheen 5.2s cubic-bezier(.16,1,.3,1) 1s infinite;
    }

    @keyframes mobileProfileReveal {
      from {
        opacity: 0;
        transform: translateY(34px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes mobileGlassSheen {
      0%, 28% {
        transform: translateX(0) rotate(18deg);
        opacity: 0;
      }
      42% {
        opacity: 0.62;
      }
      64%, 100% {
        transform: translateX(420%) rotate(18deg);
        opacity: 0;
      }
    }

    .mobile-profile-title {
      margin: 0 0 34px;
      max-width: 100%;
      font-size: clamp(2rem, 9vw, 2.85rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0;

      text-shadow:
        0 0 10px rgba(255, 255, 255, 0.72),

    }

    body:not(.not-loaded) .mobile-profile-title {
      animation: mobileTitlePulse 3.2s ease-in-out 1s infinite;
    }

    @keyframes mobileTitlePulse {
      0%, 100% {
        text-shadow:
          0 0 10px rgba(255, 255, 255, 0.7),
          0 0 28px rgba(255, 255, 255, 0.34);
      }
      50% {
        text-shadow:
          0 0 14px rgba(255, 255, 255, 0.86),
          0 0 38px rgba(126, 200, 200, 0.4);

    .mobile-user-panel {

      padding: 12px 14px 12px 12px;

    .mobile-avatar {

  /* ── Animasyon süresince kart hover efektleri kapalı ── */
  body.cards-locked .card {
    pointer-events: none;
  }
  body.cards-locked .card:hover {
    --hover-y: 0px !important;
    --hover-scale: 1 !important;
    --tilt-rx: 0deg !important;
    --tilt-ry: 0deg !important;
    box-shadow: var(--shadow) !important;
    border-color: var(--border) !important;
  }
  body.cards-locked .card:hover::before { opacity: 0 !important; }
  body.cards-locked .card:hover::after  { animation: none !important; }
  body.cards-locked .card:hover .logo-wrap { animation: none !important; box-shadow: none !important; }
  body.cards-locked .card:hover .card-name { animation: none !important; }
  body.cards-locked .card:hover .go-btn    { transform: none !important; }

  /* ── Buton Kilit Stili (glow bitmeden tıklanamaz) ── */
  .go-btn.btn-locked {
    pointer-events: none;
    opacity: 0.38;
    filter: grayscale(0.4);
  }

  /* ── Buton Açılış Zıplama Animasyonu ── */
  @keyframes btnUnlock {
    0%   { transform: scale(1);    opacity: 0.38; filter: grayscale(0.4); }
    45%  { transform: scale(1.13); opacity: 1;    filter: grayscale(0); }
    68%  { transform: scale(0.95); }
    85%  { transform: scale(1.05); }
    100% { transform: scale(1);    opacity: 1;    filter: grayscale(0); }
  }
  .go-btn.btn-unlocking {
    animation: btnUnlock 0.85s cubic-bezier(.34,1.4,.64,1) forwards;
    pointer-events: none;
  }

  /* ── Intro Glow Dalgası: Hover ile birebir aynı efekt ── */
  .card.intro-glow {
    --hover-y: -10px !important;
    --hover-scale: 1.03 !important;
  }
  .card.intro-glow::before { opacity: 1 !important; }
  .card.intro-glow::after {
    animation: cardShine 0.75s cubic-bezier(.16,1,.3,1) forwards !important;
  }
  .card.intro-glow .logo-wrap {
    animation: logoFloat 0.6s cubic-bezier(.16,1,.3,1) forwards !important;
  }
  .card.intro-glow .card-name {
    animation: nameSlide 1.2s cubic-bezier(.16,1,.3,1) forwards !important;
  }

  .card-instagram.intro-glow {
    box-shadow: 0 28px 70px rgba(245,133,41,0.55), 0 0 0 2px rgba(221,42,123,0.8), 0 0 40px rgba(221,42,123,0.2) !important;
    border-color: rgba(221,42,123,0.5) !important;
  }
  .card-instagram.intro-glow .logo-wrap {
    box-shadow: 0 0 0 4px rgba(221,42,123,0.3), 0 8px 24px rgba(245,133,41,0.5) !important;
  }

<script>
  // ── Kar animasyonu ──────────────────────────────────────
  (function() {
    const canvas = document.getElementById('snow-canvas');
    const ctx    = canvas.getContext('2d');

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const FLAKE_COUNT = 55;
    const flakes = [];

    // Kar tanesi şekli: küçük asterisk / ❊
    function drawFlake(x, y, r, alpha) {
      ctx.save();
      ctx.translate(x, y);
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth   = r * 0.28;
      ctx.lineCap     = 'round';
      for (let i = 0; i < 6; i++) {
        ctx.save();
        ctx.rotate((Math.PI / 3) * i);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -r);
        // küçük çapraz dallar
        ctx.moveTo(0, -r * 0.55);
        ctx.lineTo(-r * 0.28, -r * 0.83);
        ctx.moveTo(0, -r * 0.55);
        ctx.lineTo( r * 0.28, -r * 0.83);
        ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
    }

    for (let i = 0; i < FLAKE_COUNT; i++) {
      flakes.push({
        x:       Math.random() * window.innerWidth,
        y:       Math.random() * window.innerHeight,
        r:       3 + Math.random() * 5,        // boyut 3-8px
        vx:      (Math.random() - 0.5) * 0.35,
        vy:      0.25 + Math.random() * 0.55,
        alpha:   0.35 + Math.random() * 0.5,
        spin:    (Math.random() - 0.5) * 0.012,
        angle:   Math.random() * Math.PI * 2,
        twinkle: Math.random() * Math.PI * 2,
        twSpeed: 0.018 + Math.random() * 0.025,
      });
    }

    let running = true;
    function animate() {
      if (!running) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      flakes.forEach(f => {
        f.x      += f.vx;
        f.y      += f.vy;
        f.angle  += f.spin;
        f.twinkle += f.twSpeed;
        const a = f.alpha * (0.7 + 0.3 * Math.sin(f.twinkle));
        if (f.y > canvas.height + 20) { f.y = -20; f.x = Math.random() * canvas.width; }
        if (f.x < -20) f.x = canvas.width + 20;
        if (f.x > canvas.width + 20) f.x = -20;
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.angle);
        ctx.translate(-f.x, -f.y);
        drawFlake(f.x, f.y, f.r, a);
        ctx.restore();
      });
      requestAnimationFrame(animate);
    }
    animate();

    // ── Tıklanınca site başlar ──────────────────────────────
    const enterScreen = document.getElementById('enter-screen');
    const video  = document.getElementById('bg-video');

    // Hata durumunda medya elementlerini kaldır (görünüşü etkilemez)
    video.addEventListener('error', () => { video.remove(); });

    enterScreen.addEventListener('click', function handler() {
      enterScreen.removeEventListener('click', handler);

      // Video başlat
      video.play();

      // Kar ekranını soldur ve kaldır
      enterScreen.style.opacity = '0';
      setTimeout(() => {
        running = false;
        enterScreen.remove();
      }, 800);

      // Site animasyonlarını tetikle
      document.body.classList.remove('not-loaded');
      startSiteAnimations();
    });
  })();

  // ── Site animasyonlarını başlatan fonksiyon ─────────────
  function startSiteAnimations() {

    // Typewriter for title
    const el   = document.getElementById('site-title-el');
    const text = 'İsababoli';
    setTimeout(() => {
      el.classList.add('typing');
      let i = 0;
      const interval = setInterval(() => {
        el.textContent += text[i];
        i++;
        if (i >= text.length) {
          clearInterval(interval);
          el.classList.remove('typing');
          el.classList.add('done-typing');
        }
      }, 90);
    }, 1000);

    // Soldan Sağa Glow Dalgası
    const glowWaveOrder   = ['instagram', 'discord', 'tiktok', 'spotify', 'facebook'];
    const glowWaveStart   = 2400;
    const glowWaveStagger = 200;
    const glowWaveHold    = 500;

    setTimeout(() => {
      glowWaveOrder.forEach((id, i) => {
        const card = document.getElementById('card-' + id);
        if (!card) return;
        card.style.opacity   = '1';
        card.style.animation = 'none';
        setTimeout(() => {
          card.classList.add('intro-glow');
          setTimeout(() => { card.classList.remove('intro-glow'); }, glowWaveHold);
        }, i * glowWaveStagger);
      });
    }, glowWaveStart);

    // Butonları sırayla aç
    const btnUnlockOrder   = ['instagram', 'discord', 'tiktok', 'spotify', 'facebook'];
    let buttonsUnlocked = false;
    const btnUnlockStagger = 200;

    function unlockProfileButtons() {
      if (buttonsUnlocked) return;
      buttonsUnlocked = true;
      btnUnlockOrder.forEach((id, i) => {
        setTimeout(() => {
          const btn = document.getElementById(id + '-btn');
          if (!btn) return;
          btn.classList.remove('btn-locked');
          btn.classList.add('btn-unlocking');
          setTimeout(() => {
            btn.classList.remove('btn-unlocking');
            if (i === btnUnlockOrder.length - 1) {
              document.body.classList.remove('cards-locked');
            }
          }, 880);
        }, i * btnUnlockStagger);
      });
    }

    const themeIntroStart = glowWaveStart + ((glowWaveOrder.length - 1) * glowWaveStagger) + glowWaveHold + 250;
    setTimeout(unlockProfileButtons, themeIntroStart);
  }
</script>

<script>
  // ── Ses Butonu Kontrolü ──────────────────────────────
  document.addEventListener('DOMContentLoaded', function() {
    const audio   = document.getElementById('bg-video');
    const range   = document.getElementById('vol-range');
    const iconOn  = document.getElementById('vol-icon-on');
    const iconOff = document.getElementById('vol-icon-off');
    const iconBtn = document.getElementById('vol-icon-btn');
    const widget  = document.getElementById('vol-widget');
    const mobileVolumeQuery = window.matchMedia('(max-width: 768px), (hover: none) and (pointer: coarse)');

    let lastVol = 0.7;
    let isMuted = false;

    function updateFill(val) {
      range.style.setProperty('--vol-fill', val + '%');
    }

    function isMobileVolume() {
      return mobileVolumeQuery.matches;
    }

    function setVolumeIcon(muted) {
      iconOn.style.display  = muted ? 'none' : '';
      iconOff.style.display = muted ? '' : 'none';
      iconBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
    }

    function setVolumeOpen(open) {
      widget.classList.toggle('vol-open', open);
      iconBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function toggleMute() {
      if (!isMuted) {
        lastVol = audio.volume > 0 ? audio.volume : lastVol || 0.7;
        audio.volume = 0;
        range.value  = 0;
        updateFill(0);
        isMuted = true;
        setVolumeIcon(true);
      } else {
        const restoreVol = lastVol > 0 ? lastVol : 0.7;
        audio.volume = restoreVol;
        range.value  = Math.round(restoreVol * 100);
        updateFill(Math.round(restoreVol * 100));
        isMuted = false;
        setVolumeIcon(false);
      }
    }

    // Başlangıç sesi %70
    audio.volume = 0.7;
    updateFill(70);
    iconBtn.setAttribute('aria-expanded', 'false');
    iconBtn.setAttribute('aria-pressed', 'false');

    // Slider → ses seviyesi
    range.addEventListener('input', function() {
      const v = parseInt(this.value, 10) / 100;
      audio.volume = v;
      if (v > 0) lastVol = v;
      updateFill(this.value);
      if (v === 0) {
        isMuted = true;
        setVolumeIcon(true);
      } else {
        isMuted = false;
        setVolumeIcon(false);
      }
    });

    // İkon tıkla → mute toggle
    range.addEventListener('click', function(e) {
      e.stopPropagation();
    });

    range.addEventListener('pointerdown', function(e) {
      e.stopPropagation();
    });

    widget.addEventListener('click', function(e) {
      if (!isMobileVolume()) return;
      if (iconBtn.contains(e.target) || range.contains(e.target)) return;
      e.stopPropagation();
      setVolumeOpen(!widget.classList.contains('vol-open'));
    });

    iconBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (isMobileVolume() && !widget.classList.contains('vol-open')) {
        setVolumeOpen(true);
        return;
      }
      toggleMute();
    });

    document.addEventListener('click', function(e) {
      if (!isMobileVolume() || widget.contains(e.target)) return;
      setVolumeOpen(false);
    });

    const handleVolumeModeChange = function(e) {
      if (!e.matches) setVolumeOpen(false);
    };
    if (mobileVolumeQuery.addEventListener) {
      mobileVolumeQuery.addEventListener('change', handleVolumeModeChange);
    } else if (mobileVolumeQuery.addListener) {
      mobileVolumeQuery.addListener(handleVolumeModeChange);
    }
  });
</script>

<script>

  const cardGlows = {
    instagram: '0 0 140px rgba(245,133,41,0.65), 0 0 0 4px rgba(221,42,123,0.9)',
    discord:   '0 0 140px rgba(88,101,242,0.65), 0 0 0 4px rgba(88,101,242,0.9)',
    tiktok:    '0 0 140px rgba(0,242,234,0.55),  0 0 0 4px rgba(255,0,80,0.9)',
    spotify:   '0 0 140px rgba(30,215,96,0.65),  0 0 0 4px rgba(212,245,64,0.8)',
    facebook:  '0 0 140px rgba(24,119,242,0.7),  0 0 0 4px rgba(66,176,255,0.9)',
  };

  function goToInstagram(url) { expandCard('instagram', url); }
  function goToDiscord(url)   { expandCard('discord',   url); }
  function goToTikTok(url)    { expandCard('tiktok',    url); }
  function goToSpotify(url)   { expandCard('spotify',   url); }
  function goToFacebook(url)  { expandCard('facebook',  url); }

  function expandCard(type, url) {
    const card    = document.querySelector('.card-' + type);
    const btn     = document.getElementById(type + '-btn');
    const title   = document.querySelector('.title-box-wrap');
    const allIds  = ['instagram', 'discord', 'tiktok', 'spotify', 'facebook'];
    const others  = allIds.filter(id => id !== type);

    if (window.__interactiveEffects) {
      window.__interactiveEffects.pause();
      window.__interactiveEffects.reset();
    }

    // rect'i EN BAŞTA oku — animasyonlar başlamadan önce
    const rect = card.getBoundingClientRect();

    // Kartı hemen fixed konuma al (layout'tan çıkar, kayma olmaz)
    card.style.position       = 'fixed';
    card.style.left           = rect.left + 'px';
    card.style.top            = rect.top  + 'px';
    card.style.width          = rect.width + 'px';
    card.style.height         = rect.height + 'px';
    card.style.margin         = '0';
    card.style.zIndex         = '150';
    card.style.transition     = 'none';
    card.style.display        = 'flex';
    card.style.flexDirection  = 'column';
    card.style.alignItems     = 'center';
    card.style.justifyContent = 'center';
    card.style.willChange     = 'left, top, width, height';
    card.classList.add('expanding');

    const exitClasses = ['card-exit-left','card-exit-right','card-exit-down','card-exit-up'];

    // 1) Diğer kartlar sıralı (stagger) uçup gider
    others.forEach((id, i) => {
      const el = document.getElementById('card-' + id);
      if (!el) return;
      setTimeout(() => {
        el.classList.add(exitClasses[i % exitClasses.length]);
      }, i * 60);
    });
    title.classList.add('card-exit-up');

    // 2) Buton → "Profil'e Gidiliyor..."
    setTimeout(() => {
      btn.classList.add('going');
      btn.innerHTML = 'Profil\'e Gidiliyor <span class="going-dots"><span>.</span><span>.</span><span>.</span></span>';
    }, 80);

    // 3) Tam ekrana genişlet
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const ease = 'cubic-bezier(.16,1,.3,1)';
        card.style.transition = `left 1s ${ease}, top 1s ${ease}, width 1s ${ease}, height 1s ${ease}, border-radius 1s ${ease}`;
        card.style.left         = '0';
        card.style.top          = '0';
        card.style.width        = '100vw';
        card.style.height       = '100vh';
        card.style.borderRadius = '0';
        card.style.boxShadow    = cardGlows[type]; // transition dışında — anlık
      });
    });

    // 5) Parlama flaşı — kart tam ekrana gerilince
    setTimeout(() => {
      const flash = document.getElementById('flash-overlay');
      flash.classList.remove('flash');
      flash.offsetWidth; // reflow
      flash.classList.add('flash');
    }, 1380);

    // 6) Sayfayı aç & sıfırla
    setTimeout(() => {
      window.open(url, '_blank');
      setTimeout(() => {
        card.style.transition = 'opacity 0.6s cubic-bezier(.7,0,.3,1)';
        card.style.opacity    = '0';
        setTimeout(() => {
          card.removeAttribute('style');
          // Giriş animasyonunun yeniden başlamasını ve transform kilidini önle
          card.style.opacity   = '1';
          card.style.animation = 'none';
          card.classList.remove('expanding');
          others.forEach(id => {
            const el = document.getElementById('card-' + id);
            if (el) el.className = el.className.replace(/card-exit-\w+/g, '').trim();
          });
          title.classList.remove('card-exit-up');
          btn.classList.remove('going');
          btn.innerHTML = 'Profil\'e Git';
          if (window.__interactiveEffects) {
            window.__interactiveEffects.resume();
          }
        }, 620);
      }, 350);
    }, 2600);
  }

</script>

<script>
/* --- YENI: Parallax, Tilt ve Partikul Efektleri --- */
(function() {
  const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  const hoverNoneQuery = window.matchMedia('(hover: none)');
  const coarsePointerQuery = window.matchMedia('(pointer: coarse)');
  const cards = Array.from(document.querySelectorAll('.card'));
  const title = document.querySelector('.title-box-wrap');
  const particleCanvas = document.getElementById('particle-canvas');
  const particleCtx = particleCanvas ? particleCanvas.getContext('2d', { alpha: true, willReadFrequently: false }) : null;

  const MAX_PARALLAX = 15;
  const MAX_TILT = 12;
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const particleMouse = { x: -9999, y: -9999, active: false };

  let interactivePaused = false;
  let parallaxRaf = 0;
  let targetParallaxX = 0;
  let targetParallaxY = 0;
  let currentParallaxX = 0;
  let currentParallaxY = 0;

  function isReduced() {
    return motionQuery.matches;
  }

  function isCoarsePointer() {
    return hoverNoneQuery.matches || coarsePointerQuery.matches;
  }

  function roundToDevicePixel(value) {
    return Math.round(value * DPR) / DPR;
  }

  function setVar(el, name, value) {
    if (el) el.style.setProperty(name, value);
  }

  function resetCard(card) {
    setVar(card, '--parallax-x', '0px');
    setVar(card, '--parallax-y', '0px');
    setVar(card, '--tilt-rx', '0deg');
    setVar(card, '--tilt-ry', '0deg');
    setVar(card, '--touch-scale', '1');
    card.classList.remove('tilt-active', 'tilt-resetting');
    const glare = card.querySelector('.card-glare');
    if (glare) glare.style.opacity = '0';
  }

  function resetAllInteractiveEffects() {
    setVar(title, '--parallax-x', '0px');
    setVar(title, '--parallax-y', '0px');
    cards.forEach(resetCard);
    currentParallaxX = 0;
    currentParallaxY = 0;
    targetParallaxX = 0;
    targetParallaxY = 0;
  }

  window.__interactiveEffects = {
    pause() {
      interactivePaused = true;
      resetAllInteractiveEffects();
    },
    resume() {
      interactivePaused = false;
    },
    reset: resetAllInteractiveEffects
  };

  cards.forEach(card => {
    if (!card.querySelector('.card-glare')) {
      const glare = document.createElement('div');
      glare.className = 'card-glare';
      glare.setAttribute('aria-hidden', 'true');
      card.appendChild(glare);
    }
  });

  function applyParallax() {
    const baseX = roundToDevicePixel(currentParallaxX * MAX_PARALLAX);
    const baseY = roundToDevicePixel(currentParallaxY * MAX_PARALLAX);

    if (title) {
      setVar(title, '--parallax-x', `${roundToDevicePixel(baseX * 0.18)}px`);
      setVar(title, '--parallax-y', `${roundToDevicePixel(baseY * 0.18)}px`);
    }

    cards.forEach(card => {
      if (card.classList.contains('expanding')) return;
      const depth = parseFloat(card.dataset.depth || '0.5');
      setVar(card, '--parallax-x', `${roundToDevicePixel(baseX * depth)}px`);
      setVar(card, '--parallax-y', `${roundToDevicePixel(baseY * depth)}px`);
    });
  }

  function runParallaxFrame() {
    parallaxRaf = 0;
    const enabled = !interactivePaused && !isReduced() && !isCoarsePointer();
    const destX = enabled ? targetParallaxX : 0;
    const destY = enabled ? targetParallaxY : 0;

    currentParallaxX += (destX - currentParallaxX) * 0.12;
    currentParallaxY += (destY - currentParallaxY) * 0.12;

    if (Math.abs(destX - currentParallaxX) < 0.001) currentParallaxX = destX;
    if (Math.abs(destY - currentParallaxY) < 0.001) currentParallaxY = destY;

    applyParallax();

    if (enabled || currentParallaxX !== 0 || currentParallaxY !== 0) {
      parallaxRaf = requestAnimationFrame(runParallaxFrame);
    }
  }

  function scheduleParallax() {
    if (!parallaxRaf) parallaxRaf = requestAnimationFrame(runParallaxFrame);
  }

  function updatePointerPosition(clientX, clientY) {
    particleMouse.x = clientX;
    particleMouse.y = clientY;
    particleMouse.active = true;
  }

  document.addEventListener('pointermove', event => {
    updatePointerPosition(event.clientX, event.clientY);
    if (interactivePaused || isReduced() || isCoarsePointer()) return;
    targetParallaxX = ((event.clientX / window.innerWidth) - 0.5) * 2;
    targetParallaxY = ((event.clientY / window.innerHeight) - 0.5) * 2;
    scheduleParallax();
  }, { passive: true });

  document.addEventListener('mouseleave', () => {
    particleMouse.active = false;
    targetParallaxX = 0;
    targetParallaxY = 0;
    scheduleParallax();
  }, { passive: true });

  window.addEventListener('blur', () => {
    particleMouse.active = false;
    targetParallaxX = 0;
    targetParallaxY = 0;
    scheduleParallax();
  });

  document.addEventListener('touchmove', event => {
    const touch = event.touches && event.touches[0];
    if (!touch) return;
    updatePointerPosition(touch.clientX, touch.clientY);
  }, { passive: true });

  document.addEventListener('touchend', () => { particleMouse.active = false; }, { passive: true });
  document.addEventListener('touchcancel', () => { particleMouse.active = false; }, { passive: true });

  function updateTilt(card, clientX, clientY) {
    if (interactivePaused || isReduced()) return;
    const rect = card.getBoundingClientRect();
    if (!rect.width || !rect.height) return;

    const localX = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    const localY = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
    const rotateY = (localX - 0.5) * MAX_TILT * 2;
    const rotateX = -(localY - 0.5) * MAX_TILT * 2;
    const glareAngle = Math.atan2(localY - 0.5, localX - 0.5) * 180 / Math.PI + 180;
    const glare = card.querySelector('.card-glare');

    card.classList.add('tilt-active');
    card.classList.remove('tilt-resetting');
    setVar(card, '--tilt-rx', `${rotateX.toFixed(2)}deg`);
    setVar(card, '--tilt-ry', `${rotateY.toFixed(2)}deg`);

    if (glare) {
      glare.style.opacity = '0.15';
      glare.style.background = `linear-gradient(${glareAngle.toFixed(1)}deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.07) 36%, rgba(255,255,255,0) 72%)`;
    }
  }

  function resetTilt(card) {
    setVar(card, '--tilt-rx', '0deg');
    setVar(card, '--tilt-ry', '0deg');
    const glare = card.querySelector('.card-glare');
    if (glare) glare.style.opacity = '0';
    card.classList.remove('tilt-active');
    if (!isReduced()) {
      card.classList.add('tilt-resetting');
      window.clearTimeout(card.__tiltResetTimer);
      card.__tiltResetTimer = window.setTimeout(() => {
        card.classList.remove('tilt-resetting');
      }, 650);
    }
  }

  cards.forEach(card => {
    card.addEventListener('pointerenter', event => {
      if (isCoarsePointer() || event.pointerType === 'touch') return;
      updateTilt(card, event.clientX, event.clientY);
    }, { passive: true });

    card.addEventListener('pointermove', event => {
      if (isCoarsePointer() || event.pointerType === 'touch') return;
      updateTilt(card, event.clientX, event.clientY);
    }, { passive: true });

    card.addEventListener('pointerleave', () => resetTilt(card), { passive: true });

    card.addEventListener('touchstart', event => {
      const touch = event.touches && event.touches[0];
      if (!touch) return;
      updateTilt(card, touch.clientX, touch.clientY);
    }, { passive: true });

    card.addEventListener('touchmove', event => {
      const touch = event.touches && event.touches[0];
      if (!touch) return;
      updateTilt(card, touch.clientX, touch.clientY);
    }, { passive: true });

    card.addEventListener('touchend', () => resetTilt(card), { passive: true });
    card.addEventListener('touchcancel', () => resetTilt(card), { passive: true });
  });

  const particlePalette = ['#b07fff', '#7ec8c8', '#f58529', '#dd2a7b'];
  const particles = [];
  let particleWidth = window.innerWidth;
  let particleHeight = window.innerHeight;
  let particleRaf = 0;
  let particleLastTime = 0;
  let particleResizeRaf = 0;
  let fpsFrames = 0;
  let fpsWindowStart = performance.now();

  class Particle {
    constructor() {
      this.x = Math.random() * particleWidth;
      this.y = Math.random() * particleHeight;
      this.vx = (Math.random() - 0.5) * 10;
      this.vy = (Math.random() - 0.5) * 8;
      this.radius = 2 + Math.random() * 3;
      this.color = particlePalette[Math.floor(Math.random() * particlePalette.length)];
      this.phase = Math.random() * Math.PI * 2;
      this.amplitude = 12 + Math.random() * 18;
      this.speed = 0.45 + Math.random() * 0.75;
      this.opacity = 0.3 + Math.random() * 0.4;
    }

    update(deltaTime) {
      this.x += this.vx * deltaTime;
      this.y += this.vy * deltaTime;
      this.phase += this.speed * deltaTime;

      const pad = this.amplitude + this.radius + 10;
      if (this.x < -pad) this.x = particleWidth + pad;
      if (this.x > particleWidth + pad) this.x = -pad;
      if (this.y < -pad) this.y = particleHeight + pad;
      if (this.y > particleHeight + pad) this.y = -pad;
    }

    point() {
      let x = this.x + Math.sin(this.phase) * this.amplitude;
      let y = this.y + Math.cos(this.phase * 0.7) * this.amplitude * 0.35;

      if (particleMouse.active) {
        const dx = x - particleMouse.x;
        const dy = y - particleMouse.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 0 && dist < 100) {
          const force = (1 - dist / 100) * 15;
          x += (dx / dist) * force;
          y += (dy / dist) * force;
        }
      }

      return {
        x,
        y,
        radius: this.radius,
        color: this.color,
        alpha: this.opacity * (0.7 + 0.3 * Math.sin(this.phase * 1.4))
      };
    }
  }

  function desiredParticleCount() {
    return window.innerWidth < 768 ? 20 : 50;
  }

  function minParticleCount() {
    return window.innerWidth < 768 ? 12 : 28;
  }

  function syncParticleCount() {
    const desired = desiredParticleCount();
    while (particles.length < desired) particles.push(new Particle());
    if (particles.length > desired) particles.splice(desired);
  }

  function resizeParticles() {
    if (!particleCanvas || !particleCtx) return;
    particleWidth = window.innerWidth;
    particleHeight = window.innerHeight;
    particleCanvas.width = Math.floor(particleWidth * DPR);
    particleCanvas.height = Math.floor(particleHeight * DPR);
    particleCanvas.style.width = `${particleWidth}px`;
    particleCanvas.style.height = `${particleHeight}px`;
    particleCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    syncParticleCount();
  }

  function drawConnections(points) {
    if (window.innerWidth < 768) return;

    const cellSize = 120;
    const grid = new Map();
    const connections = new Array(points.length).fill(0);

    points.forEach((point, index) => {
      const gx = Math.floor(point.x / cellSize);
      const gy = Math.floor(point.y / cellSize);
      const key = `${gx},${gy}`;
      if (!grid.has(key)) grid.set(key, []);
      grid.get(key).push(index);
    });

    points.forEach((point, index) => {
      const gx = Math.floor(point.x / cellSize);
      const gy = Math.floor(point.y / cellSize);

      for (let ox = -1; ox <= 1; ox++) {
        for (let oy = -1; oy <= 1; oy++) {
          const neighbors = grid.get(`${gx + ox},${gy + oy}`);
          if (!neighbors) continue;

          for (const otherIndex of neighbors) {
            if (otherIndex <= index || connections[index] >= 3) continue;
            if (connections[otherIndex] >= 3) continue;

            const other = points[otherIndex];
            const dx = point.x - other.x;
            const dy = point.y - other.y;
            const dist = Math.hypot(dx, dy);
            if (dist > 120) continue;

            const alpha = 0.08 * (1 - dist / 120);
            particleCtx.beginPath();
            particleCtx.moveTo(point.x, point.y);
            particleCtx.lineTo(other.x, other.y);
            particleCtx.strokeStyle = `rgba(255,255,255,${alpha.toFixed(3)})`;
            particleCtx.lineWidth = 0.7;
            particleCtx.stroke();
            connections[index]++;
            connections[otherIndex]++;
          }
        }
      }
    });
  }

  function drawParticles(points) {
    points.forEach(point => {
      particleCtx.beginPath();
      particleCtx.arc(point.x, point.y, point.radius, 0, Math.PI * 2);
      particleCtx.fillStyle = point.color;
      particleCtx.globalAlpha = point.alpha;
      particleCtx.fill();
    });
    particleCtx.globalAlpha = 1;
  }

  function adaptParticleQuality(now) {
    fpsFrames++;
    if (now - fpsWindowStart < 1000) return;

    const fps = fpsFrames * 1000 / (now - fpsWindowStart);
    fpsFrames = 0;
    fpsWindowStart = now;

    if (fps < 55 && particles.length > minParticleCount()) {
      particles.splice(Math.max(minParticleCount(), particles.length - 5));
    }
  }

  function runParticles(now) {
    if (isReduced()) {
      stopParticles();
      return;
    }

    if (!particleLastTime) particleLastTime = now;
    const deltaTime = Math.min((now - particleLastTime) / 1000, 0.033);
    particleLastTime = now;

    particleCtx.clearRect(0, 0, particleWidth, particleHeight);
    particles.forEach(particle => particle.update(deltaTime));
    const points = particles.map(particle => particle.point());
    drawConnections(points);
    drawParticles(points);
    adaptParticleQuality(now);

    particleRaf = requestAnimationFrame(runParticles);
  }

  function startParticles() {
    if (!particleCanvas || !particleCtx || isReduced()) return;
    particleCanvas.style.display = 'block';
    resizeParticles();
    if (!particleRaf) {
      particleLastTime = 0;
      fpsFrames = 0;
      fpsWindowStart = performance.now();
      particleRaf = requestAnimationFrame(runParticles);
    }
  }

  function stopParticles() {
    if (particleRaf) cancelAnimationFrame(particleRaf);
    particleRaf = 0;
    if (particleCtx) particleCtx.clearRect(0, 0, particleWidth, particleHeight);
    if (particleCanvas) particleCanvas.style.display = 'none';
  }

  function onResize() {
    if (particleResizeRaf) return;
    particleResizeRaf = requestAnimationFrame(() => {
      particleResizeRaf = 0;
      resizeParticles();
      targetParallaxX = 0;
      targetParallaxY = 0;
      scheduleParallax();
    });
  }

  window.addEventListener('resize', onResize, { passive: true });

  function addMediaChangeListener(query, handler) {
    if (query.addEventListener) query.addEventListener('change', handler);
    else query.addListener(handler);
  }

  addMediaChangeListener(motionQuery, () => {
    if (isReduced()) {
      interactivePaused = true;
      resetAllInteractiveEffects();
      stopParticles();
    } else {
      interactivePaused = false;
      resetAllInteractiveEffects();
      startParticles();
    }
  });

  addMediaChangeListener(hoverNoneQuery, () => {
    targetParallaxX = 0;
    targetParallaxY = 0;
    scheduleParallax();
  });

  addMediaChangeListener(coarsePointerQuery, () => {
    targetParallaxX = 0;
    targetParallaxY = 0;
    scheduleParallax();
  });

  if (isReduced()) {
    resetAllInteractiveEffects();
    stopParticles();
  } else {
    startParticles();
  }
})();
</script>

<canvas id="cursor-canvas" style="
  position:fixed;inset:0;width:100%;height:100%;
  z-index:99998;pointer-events:none;
"></canvas>

<script>
(function() {
  const canvas = document.getElementById('cursor-canvas');
  const ctx    = canvas.getContext('2d');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const TRAIL_LEN = 55;
  const trail = [];
  let mx = -200, my = -200;
  let visible = false;

  // Tıklama animasyonu: 0=yok, 0→1=animasyon sürüyor
  let clickProgress = 0;

  document.addEventListener('mousemove', e => {
    mx = e.clientX;
    my = e.clientY;
    visible = true;
  });

  // İmleç ekrandan çıkınca: iz + nokta tamamen temizlenir
  document.addEventListener('mouseleave', () => {
    visible = false;
    trail.length = 0; // İzi anında sil
  });

  document.addEventListener('mouseenter', () => {
    visible = true;
  });

  // Tıklama: küçül → büyü animasyonu başlat
  document.addEventListener('mousedown', () => {
    clickProgress = 0.001;
  });

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (visible) {
      trail.push({ x: mx, y: my });
    }
    while (trail.length > TRAIL_LEN) trail.shift();

    // İz — sadece visible iken çizilir, çıkınca trail.length=0 olduğu için zaten yok
    for (let i = 1; i < trail.length; i++) {
      const t = i / trail.length;
      const alpha = t * t * 0.55;
      const width = t * 2.2;
      ctx.beginPath();
      ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
      ctx.lineTo(trail[i].x,     trail[i].y);
      ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
      ctx.lineWidth   = width;
      ctx.lineCap     = 'round';
      ctx.lineJoin    = 'round';
      ctx.stroke();
    }

    // Ana nokta
    if (visible && trail.length > 0) {
      const p = trail[trail.length - 1];

      // Tıklama scale hesapla: sin eğrisiyle küçülüp büyür
      let scale = 1;
      if (clickProgress > 0) {
        scale = 1 - Math.sin(clickProgress * Math.PI) * 0.6; // 1 → 0.4 → 1
        clickProgress += 0.055;
        if (clickProgress >= 1) clickProgress = 0;
      }

      const dotR  = 4  * scale;
      const haloR = 18 * scale;

      // Dış halo
      if (haloR > 0.5) {
        const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, haloR);
        glow.addColorStop(0,    'rgba(255,255,255,0.22)');
        glow.addColorStop(0.45, 'rgba(255,255,255,0.08)');
        glow.addColorStop(1,    'rgba(255,255,255,0)');
        ctx.beginPath();
        ctx.arc(p.x, p.y, haloR, 0, Math.PI * 2);
        ctx.fillStyle = glow;
        ctx.fill();
      }

      // İç parlak nokta
      if (dotR > 0.3) {
        const dot = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, dotR);
        dot.addColorStop(0,   'rgba(255,255,255,1)');
        dot.addColorStop(0.5, 'rgba(220,220,255,0.85)');
        dot.addColorStop(1,   'rgba(255,255,255,0)');
        ctx.beginPath();
        ctx.arc(p.x, p.y, dotR, 0, Math.PI * 2);
        ctx.fillStyle = dot;
        ctx.fill();
      }
    }

    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

<style>
  /* Tarayıcının varsayılan imlecini gizle */
  *, *::before, *::after { cursor: none !important; }
</style>
